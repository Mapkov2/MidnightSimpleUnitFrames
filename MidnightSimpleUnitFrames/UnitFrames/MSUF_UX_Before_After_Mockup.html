}

}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {

}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;msuf-ux-compare&#x27;);
      const afterPanel = root.querySelector(&#x27;[data-panel=&quot;after&quot;]&#x27;);

      const icons = {
        dashboard: &#x27;layout-dashboard&#x27;, unitframes: &#x27;panel-top&#x27;, group: &#x27;users&#x27;,
        auras: &#x27;sparkles&#x27;, profiles: &#x27;layers&#x27;, bars: &#x27;chart-no-axes-column-increasing&#x27;,
        cast: &#x27;wand-sparkles&#x27;, colors: &#x27;palette&#x27;, fonts: &#x27;type&#x27;, misc: &#x27;settings-2&#x27;,
        classpower: &#x27;zap&#x27;, gameplay: &#x27;gamepad-2&#x27;

      const pageMeta = {
        dashboard: { title: &#x27;MSUF Menu&#x27;, subtitle: &#x27;Assistant, Setup, Recovery und Status an einem Ort.&#x27; },
        unitframes: { title: &#x27;Unitframes&#x27;, subtitle: &#x27;Frame-spezifische Darstellung, Texte, Auren und Castbars.&#x27; },

        profiles: { title: &#x27;Profiles&#x27;, subtitle: &#x27;Profile verwalten, Spezialisierungen zuweisen und importieren.&#x27; },
        bars: { title: &#x27;Bars&#x27;, subtitle: &#x27;Texturen, Hintergründe, Abstände und gemeinsame Balkenregeln.&#x27; },
        cast: { title: &#x27;Cast Bars&#x27;, subtitle: &#x27;Castbar-Größe, Farben, Ticks, Icons und Unterbrechbarkeit.&#x27; },
        colors: { title: &#x27;Colors&#x27;, subtitle: &#x27;Klassen-, Reaktions-, Ressourcen- und Statusfarben zentral verwalten.&#x27; },
        fonts: { title: &#x27;Fonts&#x27;, subtitle: &#x27;Schriftfamilien, Größen, Konturen und globale Textstile.&#x27; },
        misc: { title: &#x27;Miscellaneous&#x27;, subtitle: &#x27;Tooltips, Fading, Reichweite und weitere globale Details.&#x27; },
        classpower: { title: &#x27;Class Resources&#x27;, subtitle: &#x27;Klassenspezifische Ressourcen und wichtige Zustände.&#x27; },
        gameplay: { title: &#x27;Gameplay&#x27;, subtitle: &#x27;Kontextabhängiges Verhalten für Kampf, Gruppen und Instanzen.&#x27; }
      };

      function icon(name) {
        return `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
      }

      function navButton(key, label, active) {
        return `&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;${active ? &#x27;true&#x27; : &#x27;false&#x27;}&quot; data-page-jump=&quot;${key}&quot;&gt;${icon(icons[key] || &#x27;circle&#x27;)}&lt;span&gt;${label}&lt;/span&gt;&lt;/button&gt;`;

      function windowBar(future) {
        return `&lt;div class=&quot;ms-windowbar&quot;&gt;
          &lt;div class=&quot;ms-brand&quot;&gt;&lt;span class=&quot;ms-brand-mark&quot;&gt;M&lt;/span&gt;&lt;span&gt;&lt;strong&gt;MSUF&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${future ? &#x27;Visual Editor&#x27; : &#x27;Menu2&#x27;}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ms-window-actions&quot;&gt;
            ${future ? `&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-tooltip=&quot;Änderung zurücknehmen&quot;&gt;${icon(&#x27;undo-2&#x27;)} Undo&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-tooltip=&quot;Änderung wiederholen&quot;&gt;${icon(&#x27;redo-2&#x27;)} Redo&lt;/button&gt;` : &#x27;&#x27;}

            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-label=&quot;Schließen&quot;&gt;${icon(&#x27;x&#x27;)}&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;`;

          &lt;div class=&quot;ms-options-grid&quot;&gt;${sections.map((title, index) =&gt; `&lt;section class=&quot;ms-section ${index &gt; 1 ? &#x27;is-collapsed&#x27; : &#x27;&#x27;}&quot; data-section=&quot;global-${index}&quot;&gt;&lt;button class=&quot;ms-section-button&quot; type=&quot;button&quot; data-section-toggle&gt;&lt;span&gt;&lt;strong&gt;${title}&lt;/strong&gt;&lt;small&gt;${index === 0 ? &#x27;Primary size, style and visibility controls&#x27; : index === 1 ? &#x27;Shared values and frame-specific inheritance&#x27; : &#x27;Detailed behavior and advanced controls&#x27;}&lt;/small&gt;&lt;/span&gt;&lt;span&gt;${index &gt; 1 ? &#x27;⌄&#x27; : &#x27;⌃&#x27;}&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;ms-section-body&quot;&gt;&lt;div class=&quot;ms-row&quot;&gt;&lt;label&gt;Enabled&lt;/label&gt;&lt;label class=&quot;form-check form-switch&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; checked&gt;&lt;span class=&quot;form-check-label&quot;&gt;On&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;ms-row&quot;&gt;&lt;label&gt;Amount &lt;output data-range-output=&quot;${page}-${index}&quot;&gt;${48 + index * 8}%&lt;/output&gt;&lt;/label&gt;&lt;input class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;${48 + index * 8}&quot; data-range-id=&quot;${page}-${index}&quot; data-range-unit=&quot;%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ms-row&quot;&gt;&lt;label&gt;Source&lt;/label&gt;&lt;select class=&quot;form-select&quot;&gt;&lt;option&gt;Global default&lt;/option&gt;&lt;option&gt;Custom override&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
      }

      const currentPages = { dashboard: currentDashboard, unitframes: currentUnitframes, group: currentGroup, auras: currentAuras, profiles: currentProfiles };
      const futurePages = {
        dashboard: futureDashboard,
        unitframes: futureUnitframes,
        group: futureGroup,
        auras: futureAuras,
        profiles: futureProfiles,
        bars: () =&gt; futureGlobal(&#x27;bars&#x27;),
        cast: () =&gt; futureGlobal(&#x27;cast&#x27;),
        colors: () =&gt; futureGlobal(&#x27;colors&#x27;),
        fonts: () =&gt; futureGlobal(&#x27;fonts&#x27;),
        misc: () =&gt; futureGlobal(&#x27;misc&#x27;),
        classpower: () =&gt; futureGlobal(&#x27;classpower&#x27;),
        gameplay: () =&gt; futureGlobal(&#x27;gameplay&#x27;)
      };

      function render(page) {
        afterPanel.innerHTML = `${windowBar(true)}&lt;div class=&quot;ms-body&quot;&gt;${afterNav(page)}&lt;div class=&quot;ms-main&quot;&gt;${statusBar(true)}&lt;main class=&quot;ms-content&quot;&gt;${futurePages[page]()}&lt;/main&gt;&lt;/div&gt;&lt;/div&gt;`;
        root.querySelectorAll(&#x27;[data-page-jump]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            const target = button.getAttribute(&#x27;data-page-jump&#x27;);
            if (futurePages[target]) {
              render(target);
            }
          });
        });
        root.querySelectorAll(&#x27;[data-section-toggle]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            const section = button.closest(&#x27;.ms-section&#x27;);
            section.classList.toggle(&#x27;is-collapsed&#x27;);
            const marker = button.lastElementChild;
            if (marker) marker.textContent = section.classList.contains(&#x27;is-collapsed&#x27;) ? &#x27;⌄&#x27; : &#x27;⌃&#x27;;
          });
        });
        root.querySelectorAll(&#x27;[data-preview-target]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            const target = button.getAttribute(&#x27;data-preview-target&#x27;);
            const section = root.querySelector(`[data-section=&quot;${target}&quot;]`);
            root.querySelectorAll(&#x27;.ms-section.is-focused&#x27;).forEach(item =&gt; item.classList.remove(&#x27;is-focused&#x27;));
            if (section) {
              section.classList.remove(&#x27;is-collapsed&#x27;);
              section.classList.add(&#x27;is-focused&#x27;);
              const marker = section.querySelector(&#x27;.ms-section-button &gt; span:last-child&#x27;);
              if (marker) marker.textContent = &#x27;⌃&#x27;;
              section.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;center&#x27; });
            }
            const selected = root.querySelector(&#x27;[data-selected-element]&#x27;);
            if (selected) selected.textContent = button.textContent.trim();
          });
        });
        root.querySelectorAll(&#x27;[data-range-id]&#x27;).forEach(input =&gt; {
          input.addEventListener(&#x27;input&#x27;, () =&gt; {
            const output = root.querySelector(`[data-range-output=&quot;${input.getAttribute(&#x27;data-range-id&#x27;)}&quot;]`);
            if (output) output.textContent = `${input.value}${input.getAttribute(&#x27;data-range-unit&#x27;) || &#x27;&#x27;}`;
          });
        });
        root.querySelectorAll(&#x27;.ms-preset&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            root.querySelectorAll(&#x27;.ms-preset&#x27;).forEach(item =&gt; item.classList.remove(&#x27;is-selected&#x27;));
            button.classList.add(&#x27;is-selected&#x27;);
          });
        });
        root.querySelectorAll(&#x27;[data-page-filter]&#x27;).forEach(input =&gt; {
          input.addEventListener(&#x27;input&#x27;, () =&gt; {
            const query = input.value.trim().toLowerCase();
            root.querySelectorAll(&#x27;.ms-options-grid &gt; .ms-section&#x27;).forEach(section =&gt; {
              section.hidden = query !== &#x27;&#x27; &amp;&amp; !section.textContent.toLowerCase().includes(query);
            });
          });
        });
        if (window.lucide &amp;&amp; typeof window.lucide.createIcons === &#x27;function&#x27;) {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      }

      root.dataset.view = &#x27;after&#x27;;
      render(&#x27;unitframes&#x27;);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
