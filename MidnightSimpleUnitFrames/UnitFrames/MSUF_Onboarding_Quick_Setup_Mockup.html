.form-range::-moz-range-track {
  height: 28px;

}

.form-range::-moz-range-thumb {

  height: 20px;

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

}

.form-range:disabled {

}

.btn:not(.btn-primary, .viz-tile):is(

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

}

.btn:focus-visible {

}

svg {

&lt;body&gt;
&lt;div id=&quot;msuf-onboarding-demo&quot; aria-label=&quot;Interactive MSUF Quick Setup onboarding mockup&quot;&gt;
  &lt;style&gt;
    #msuf-onboarding-demo {
      --msuf-shadow: #050a12;
      --msuf-ink: #07101b;
      --msuf-surface: #09111d;
      --msuf-raised: #0e1929;
      --msuf-rim: #1a2c42;

      --msuf-blue-deep: #245dbc;

      --msuf-success: #42d392;

      --msuf-danger: #e0525e;
      width: 100%;
      color: var(--msuf-text);
      color-scheme: dark;
      font-family: Inter, &quot;Segoe UI&quot;, Arial, sans-serif;

    #msuf-onboarding-demo * { box-sizing: border-box; }

    #msuf-onboarding-demo .msuf-stage {

        linear-gradient(180deg, var(--msuf-ink), var(--msuf-shadow));
    }

    #msuf-onboarding-demo .msuf-window {
      width: 100%;
      min-height: 760px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 1px solid var(--msuf-rim);
      border-radius: 14px;
      background: linear-gradient(180deg, var(--msuf-raised), var(--msuf-shadow));
      box-shadow: 0 24px 72px color-mix(in srgb, var(--msuf-shadow) 72%, transparent), inset 0 1px color-mix(in srgb, var(--msuf-text) 5%, transparent);
    }

    #msuf-onboarding-demo .msuf-topbar {
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(210px, auto) 1fr auto;

      border-bottom: 1px solid var(--msuf-rim);
      background: linear-gradient(180deg, color-mix(in srgb, var(--msuf-raised) 94%, var(--msuf-blue) 6%), var(--msuf-ink));

    #msuf-onboarding-demo .msuf-brand,
    #msuf-onboarding-demo .msuf-top-actions,
    #msuf-onboarding-demo .msuf-profile-context,
    #msuf-onboarding-demo .msuf-statusbar,
    #msuf-onboarding-demo .msuf-page-heading,
    #msuf-onboarding-demo .msuf-actionbar,
    #msuf-onboarding-demo .msuf-help-strip,
    #msuf-onboarding-demo .msuf-control-line,

      height: 32px;

      place-items: center;

      border-radius: 9px;
      background: radial-gradient(circle at 35% 28%, var(--msuf-blue-hot), var(--msuf-blue-deep) 48%, var(--msuf-ink) 49%);
      box-shadow: 0 0 22px color-mix(in srgb, var(--msuf-blue) 24%, transparent);
    }

    #msuf-onboarding-demo .msuf-brand-mark::before {
      content: &quot;&quot;;
      width: 13px;
      height: 17px;
      border: 2px solid var(--msuf-text);
      border-radius: 7px 7px 10px 10px;
      clip-path: polygon(50% 100%, 0 66%, 0 0, 100% 0, 100% 66%);

    #msuf-onboarding-demo .msuf-brand-copy { min-width: 0; }
    #msuf-onboarding-demo .msuf-brand-title { margin: 0; white-space: nowrap; }
    #msuf-onboarding-demo .msuf-brand-sub { color: var(--msuf-muted); }
    #msuf-onboarding-demo .msuf-profile-context { justify-content: center; gap: 8px; min-width: 0; }
    #msuf-onboarding-demo .msuf-top-actions { justify-content: flex-end; gap: 4px; }

    #msuf-onboarding-demo .msuf-body {
      min-width: 0;
      display: grid;
      grid-template-columns: 198px minmax(0, 1fr);
    }

    #msuf-onboarding-demo .msuf-nav {
      min-width: 0;
      padding: 14px 10px;
      border-right: 1px solid var(--msuf-rim);
      background: linear-gradient(180deg, var(--msuf-ink), color-mix(in srgb, var(--msuf-shadow) 94%, var(--msuf-blue) 6%));
    }

    #msuf-onboarding-demo .msuf-search-wrap { position: relative; margin-bottom: 14px; }
    #msuf-onboarding-demo .msuf-search-wrap &gt; i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--msuf-muted);
      pointer-events: none;
    }
    #msuf-onboarding-demo .msuf-search { width: 100%; padding-left: 34px; }
    #msuf-onboarding-demo .msuf-nav-section { margin: 16px 8px 6px; color: var(--msuf-muted); }
    #msuf-onboarding-demo .msuf-nav-stack { display: grid; gap: 4px; }
    #msuf-onboarding-demo .msuf-nav-stack .btn { justify-content: flex-start; width: 100%; }
    #msuf-onboarding-demo .msuf-nav-stack .is-selected {

    #msuf-onboarding-demo .msuf-page-heading { justify-content: space-between; align-items: flex-start; gap: 18px; }
    #msuf-onboarding-demo .msuf-heading-copy { min-width: 0; }
    #msuf-onboarding-demo .msuf-kicker { color: var(--msuf-blue-hot); }
    #msuf-onboarding-demo .msuf-heading-copy h1,
    #msuf-onboarding-demo .msuf-heading-copy h2,
    #msuf-onboarding-demo .msuf-heading-copy p { margin-top: 0; }
    #msuf-onboarding-demo .msuf-heading-copy p { color: var(--msuf-muted); }

    #msuf-onboarding-demo .msuf-stepper {
      display: grid;
      grid-template-columns: repeat(5, minmax(92px, 1fr));
      gap: 0;
      margin: 20px 0 24px;
    }

    #msuf-onboarding-demo .msuf-step {
      position: relative;
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--msuf-muted);
      cursor: pointer;
    }

    #msuf-onboarding-demo .msuf-step::before,
    #msuf-onboarding-demo .msuf-step::after {
      content: &quot;&quot;;
      position: absolute;
      z-index: 0;
      top: 17px;
      width: 50%;
      height: 2px;
      background: var(--msuf-rim);
    }
    #msuf-onboarding-demo .msuf-step::before { left: 0; }
    #msuf-onboarding-demo .msuf-step::after { right: 0; }
    #msuf-onboarding-demo .msuf-step:first-child::before,
    #msuf-onboarding-demo .msuf-step:last-child::after { display: none; }
    #msuf-onboarding-demo .msuf-step.is-complete::before,
    #msuf-onboarding-demo .msuf-step.is-complete::after { background: var(--msuf-success); }
    #msuf-onboarding-demo .msuf-step.is-active::before { background: var(--msuf-success); }
    #msuf-onboarding-demo .msuf-step.is-active::after { background: linear-gradient(90deg, var(--msuf-blue), var(--msuf-rim)); }

    #msuf-onboarding-demo .msuf-step-dot {
      position: relative;
      z-index: 1;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 2px solid var(--msuf-rim);
      border-radius: 50%;
      background: var(--msuf-ink);
      color: var(--msuf-dim);
    }
    #msuf-onboarding-demo .msuf-step.is-complete .msuf-step-dot {
      border-color: var(--msuf-success);
      background: var(--msuf-success);
      color: var(--msuf-shadow);
    }
    #msuf-onboarding-demo .msuf-step.is-active { color: var(--msuf-text); }
    #msuf-onboarding-demo .msuf-step.is-active .msuf-step-dot {
      border-color: var(--msuf-blue-hot);
      background: var(--msuf-blue);
      color: var(--msuf-text);
      box-shadow: 0 0 20px color-mix(in srgb, var(--msuf-blue) 38%, transparent);

    #msuf-onboarding-demo .msuf-setup-card { padding: 20px; }

    #msuf-onboarding-demo .msuf-setup-card h3,

    #msuf-onboarding-demo .msuf-split {

      grid-template-columns: minmax(210px, 280px) minmax(0, 1fr);
      gap: 20px;
      align-items: stretch;

    #msuf-onboarding-demo .msuf-controls { display: grid; align-content: start; gap: 12px; }
    #msuf-onboarding-demo .msuf-controls .btn { justify-content: center; }
    #msuf-onboarding-demo .msuf-control-line { justify-content: space-between; gap: 12px; }
    #msuf-onboarding-demo .msuf-divider { height: 1px; background: var(--msuf-rim); }

    #msuf-onboarding-demo .msuf-preview-field { min-width: 0; }

      min-height: 280px;
      display: block;
      border: 1px solid var(--msuf-rim);
      border-radius: 10px;
      background: var(--msuf-shadow);
      touch-action: none;
    }
    #msuf-onboarding-demo .msuf-preview-svg .grid-line { stroke: var(--msuf-rim); stroke-opacity: .34; }
    #msuf-onboarding-demo .msuf-preview-svg .guide-line { stroke: var(--msuf-muted); stroke-opacity: .62; stroke-dasharray: 6 5; }
    #msuf-onboarding-demo .msuf-preview-svg .frame-shell { fill: var(--msuf-ink); stroke: var(--msuf-blue); stroke-width: 2; }
    #msuf-onboarding-demo .msuf-preview-svg .frame-health { fill: var(--msuf-success); }
    #msuf-onboarding-demo .msuf-preview-svg .frame-health.injured { fill: var(--msuf-danger); }
    #msuf-onboarding-demo .msuf-preview-svg .frame-health.dead { fill: var(--msuf-dim); }
    #msuf-onboarding-demo .msuf-preview-svg .frame-power { fill: var(--msuf-blue-deep); }
    #msuf-onboarding-demo .msuf-preview-svg .frame-cast { fill: var(--msuf-warning); }
    #msuf-onboarding-demo .msuf-preview-svg .frame-dispel { stroke: var(--msuf-blue-hot); stroke-width: 4; }
    #msuf-onboarding-demo .msuf-preview-svg .frame-name,
    #msuf-onboarding-demo .msuf-preview-svg .frame-value { fill: var(--msuf-text); }
    #msuf-onboarding-demo .msuf-preview-svg .frame-sub { fill: var(--msuf-muted); }
    #msuf-onboarding-demo .msuf-preview-svg .handle { fill: var(--msuf-text); stroke: var(--msuf-blue); stroke-width: 2; }

    #msuf-onboarding-demo .msuf-help-strip {

      margin-top: 16px;

      height: 68px;

      color: var(--msuf-shadow);

    @media (max-width: 980px) {
      #msuf-onboarding-demo .msuf-topbar { grid-template-columns: 1fr auto; }
      #msuf-onboarding-demo .msuf-profile-context { display: none; }
      #msuf-onboarding-demo .msuf-body { grid-template-columns: 1fr; }
      #msuf-onboarding-demo .msuf-nav {

            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block is-selected&quot; aria-current=&quot;page&quot;&gt;&lt;i data-lucide=&quot;layout-dashboard&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Dashboard&lt;/button&gt;
            &lt;div class=&quot;msuf-nav-section text-small&quot;&gt;FRAMES&lt;/div&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;user-round&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Unitframes&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;users-round&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Party/Raid Frames&lt;/button&gt;
            &lt;div class=&quot;msuf-nav-section text-small&quot;&gt;APPEARANCE&lt;/div&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;align-justify&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Bars&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;panel-top&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Cast Bars&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;droplet&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Colors&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;type&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Fonts&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;sparkles&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Auras&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;settings&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Miscellaneous&lt;/button&gt;
            &lt;div class=&quot;msuf-nav-section text-small&quot;&gt;FEATURES&lt;/div&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;circle-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Class Resources&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;zap&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Gameplay&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost btn-block&quot;&gt;&lt;i data-lucide=&quot;layers-3&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Profiles&lt;/button&gt;
          &lt;/div&gt;
        &lt;/nav&gt;

        &lt;main class=&quot;msuf-main&quot; id=&quot;msuf-onboarding-view&quot;&gt;&lt;/main&gt;
      &lt;/div&gt;

      &lt;footer class=&quot;msuf-statusbar text-small&quot;&gt;
        &lt;span&gt;Editing profile: &lt;strong&gt;Default&lt;/strong&gt;&lt;/span&gt;
        &lt;span id=&quot;msuf-onboarding-feedback&quot; class=&quot;msuf-status-feedback&quot; aria-live=&quot;polite&quot;&gt;No changes made&lt;/span&gt;
        &lt;span&gt;Changes are saved automatically&lt;/span&gt;
      &lt;/footer&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;div id=&quot;msuf-onboarding-announcer&quot; class=&quot;sr-only&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;msuf-onboarding-demo&#x27;);
      const view = document.getElementById(&#x27;msuf-onboarding-view&#x27;);
      const feedback = document.getElementById(&#x27;msuf-onboarding-feedback&#x27;);
      const announcer = document.getElementById(&#x27;msuf-onboarding-announcer&#x27;);
      if (!root || !view || !feedback || !announcer) return;

      const steps = [
        { label: &#x27;Start&#x27;, icon: &#x27;play&#x27; },
        { label: &#x27;Position&#x27;, icon: &#x27;move&#x27; },
        { label: &#x27;Readability&#x27;, icon: &#x27;type&#x27; },
        { label: &#x27;Combat&#x27;, icon: &#x27;swords&#x27; },
        { label: &#x27;Test&#x27;, icon: &#x27;check&#x27; }
      ];

      const state = {
        mode: &#x27;welcome&#x27;,
        step: 1,
        startChoice: &#x27;current&#x27;,
        testFrames: true,
        editMode: false,
        style: &#x27;balanced&#x27;,
        frameScale: 100,
        textSize: 14,
        focus: &#x27;mixed&#x27;,
        auraPreset: &#x27;clean&#x27;,
        castBars: true,
        groupFrames: true,
        classResources: true,
        testState: &#x27;healthy&#x27;,
        imported: false,
        positions: {
          player: { x: 64, y: 72 },
          target: { x: 438, y: 72 },
          focus: { x: 252, y: 222 }
        }
      };

      function icon(name) {
        return `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
      }

      function refreshIcons() {
        if (window.lucide &amp;&amp; typeof window.lucide.createIcons === &#x27;function&#x27;) {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      }

      function setFeedback(message) {
        feedback.textContent = message;
        announcer.textContent = message;
      }

      function pageHeading(title, copy) {
        return `
          &lt;div class=&quot;msuf-page-heading&quot;&gt;
            &lt;div class=&quot;msuf-heading-copy&quot;&gt;
              &lt;div class=&quot;msuf-kicker text-small&quot;&gt;QUICK SETUP&lt;/div&gt;
              &lt;h1&gt;${title}&lt;/h1&gt;
              &lt;p&gt;${copy}&lt;/p&gt;
            &lt;/div&gt;
            &lt;span class=&quot;viz-badge&quot;&gt;Step ${state.step} of 5&lt;/span&gt;
          &lt;/div&gt;`;
      }

      function stepper() {
        return `&lt;div class=&quot;msuf-stepper&quot; aria-label=&quot;Quick Setup progress&quot;&gt;
          ${steps.map((item, index) =&gt; {
            const number = index + 1;
            const complete = number &lt; state.step;
            const active = number === state.step;
            return `&lt;button type=&quot;button&quot; class=&quot;msuf-step${complete ? &#x27; is-complete&#x27; : &#x27;&#x27;}${active ? &#x27; is-active&#x27; : &#x27;&#x27;}&quot; data-step=&quot;${number}&quot; ${active ? &#x27;aria-current=&quot;step&quot;&#x27; : &#x27;&#x27;}&gt;
              &lt;span class=&quot;msuf-step-dot&quot;&gt;${complete ? icon(&#x27;check&#x27;) : icon(item.icon)}&lt;/span&gt;
              &lt;span&gt;${item.label}&lt;/span&gt;
            &lt;/button&gt;`;
          }).join(&#x27;&#x27;)}
        &lt;/div&gt;`;
      }

      function helpStrip() {
        return `&lt;div class=&quot;msuf-help-strip&quot;&gt;
          &lt;div class=&quot;msuf-help-copy&quot;&gt;${icon(&#x27;bot&#x27;)}&lt;span&gt;Need help with this step?&lt;/span&gt;&lt;/div&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;ask&quot;&gt;Ask MSUF&lt;/button&gt;
        &lt;/div&gt;`;
      }

      function actionBar(primaryLabel) {
        return `&lt;div class=&quot;msuf-actionbar&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-action=&quot;exit&quot;&gt;Exit setup&lt;/button&gt;
          &lt;div class=&quot;msuf-actionbar-right&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-action=&quot;advanced&quot;&gt;Advanced settings&lt;/button&gt;
            ${state.step &gt; 1 ? &#x27;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;back&quot;&gt;Back&lt;/button&gt;&#x27; : &#x27;&#x27;}
            &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;keep&quot;&gt;Use current settings&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-action=&quot;next&quot;&gt;${primaryLabel}&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;`;
      }

      function frameMarkup(key, label, health, power, scale, visualState) {
        const pos = state.positions[key];
        const healthClass = visualState === &#x27;injured&#x27; ? &#x27; injured&#x27; : visualState === &#x27;dead&#x27; ? &#x27; dead&#x27; : &#x27;&#x27;;
        const borderClass = visualState === &#x27;dispellable&#x27; ? &#x27; frame-dispel&#x27; : &#x27;&#x27;;
        const cast = visualState === &#x27;casting&#x27;;
        return `&lt;g class=&quot;mock-frame${state.editMode ? &#x27; is-editable&#x27; : &#x27;&#x27;}&quot; data-frame=&quot;${key}&quot; transform=&quot;translate(${pos.x} ${pos.y}) scale(${scale})&quot;&gt;
          &lt;rect class=&quot;frame-shell${borderClass}&quot; width=&quot;258&quot; height=&quot;88&quot; rx=&quot;7&quot;&gt;&lt;/rect&gt;
          &lt;rect class=&quot;frame-health${healthClass}&quot; x=&quot;12&quot; y=&quot;32&quot; width=&quot;${health}&quot; height=&quot;24&quot; rx=&quot;3&quot;&gt;&lt;/rect&gt;
          &lt;rect class=&quot;frame-power&quot; x=&quot;12&quot; y=&quot;61&quot; width=&quot;${power}&quot; height=&quot;7&quot; rx=&quot;2&quot;&gt;&lt;/rect&gt;
          ${cast ? &#x27;&lt;rect class=&quot;frame-cast&quot; x=&quot;12&quot; y=&quot;72&quot; width=&quot;172&quot; height=&quot;7&quot; rx=&quot;2&quot;&gt;&lt;/rect&gt;&#x27; : &#x27;&#x27;}
          &lt;text class=&quot;frame-name&quot; x=&quot;12&quot; y=&quot;22&quot;&gt;${label}&lt;/text&gt;
          &lt;text class=&quot;frame-value&quot; x=&quot;244&quot; y=&quot;49&quot; text-anchor=&quot;end&quot;&gt;${visualState === &#x27;dead&#x27; ? &#x27;Dead&#x27; : visualState === &#x27;injured&#x27; ? &#x27;38%&#x27; : &#x27;100%&#x27;}&lt;/text&gt;
          &lt;text class=&quot;frame-sub&quot; x=&quot;244&quot; y=&quot;22&quot; text-anchor=&quot;end&quot;&gt;${state.editMode ? &#x27;Drag to move&#x27; : &#x27;Preview&#x27;}&lt;/text&gt;
          ${state.editMode ? `
            &lt;rect class=&quot;handle&quot; x=&quot;-4&quot; y=&quot;-4&quot; width=&quot;8&quot; height=&quot;8&quot;&gt;&lt;/rect&gt;
            &lt;rect class=&quot;handle&quot; x=&quot;254&quot; y=&quot;-4&quot; width=&quot;8&quot; height=&quot;8&quot;&gt;&lt;/rect&gt;
            &lt;rect class=&quot;handle&quot; x=&quot;-4&quot; y=&quot;84&quot; width=&quot;8&quot; height=&quot;8&quot;&gt;&lt;/rect&gt;
            &lt;rect class=&quot;handle&quot; x=&quot;254&quot; y=&quot;84&quot; width=&quot;8&quot; height=&quot;8&quot;&gt;&lt;/rect&gt;` : &#x27;&#x27;}
        &lt;/g&gt;`;
      }

      function previewSvg(visualState = &#x27;healthy&#x27;) {
        const scale = state.frameScale / 100;
        return `&lt;svg class=&quot;msuf-preview-svg&quot; viewBox=&quot;0 0 760 360&quot; role=&quot;img&quot; aria-labelledby=&quot;msuf-preview-title msuf-preview-desc&quot;&gt;
          &lt;title id=&quot;msuf-preview-title&quot;&gt;MSUF frame placement preview&lt;/title&gt;
          &lt;desc id=&quot;msuf-preview-desc&quot;&gt;Player, Target, and Focus unit frames arranged on a screen grid. Enable Edit Mode to drag them.&lt;/desc&gt;
          &lt;defs&gt;
            &lt;pattern id=&quot;msuf-grid-pattern&quot; width=&quot;28&quot; height=&quot;28&quot; patternUnits=&quot;userSpaceOnUse&quot;&gt;
              &lt;path class=&quot;grid-line&quot; d=&quot;M 28 0 L 0 0 0 28&quot; fill=&quot;none&quot;&gt;&lt;/path&gt;
            &lt;/pattern&gt;
          &lt;/defs&gt;
          &lt;rect width=&quot;760&quot; height=&quot;360&quot; fill=&quot;url(#msuf-grid-pattern)&quot;&gt;&lt;/rect&gt;
          &lt;line class=&quot;guide-line&quot; x1=&quot;380&quot; y1=&quot;0&quot; x2=&quot;380&quot; y2=&quot;360&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;guide-line&quot; x1=&quot;0&quot; y1=&quot;180&quot; x2=&quot;760&quot; y2=&quot;180&quot;&gt;&lt;/line&gt;
          ${frameMarkup(&#x27;player&#x27;, &#x27;Player&#x27;, visualState === &#x27;injured&#x27; ? 88 : 172, 118, scale, visualState)}
          ${frameMarkup(&#x27;target&#x27;, &#x27;Target&#x27;, visualState === &#x27;injured&#x27; ? 96 : 184, 102, scale, visualState)}
          ${state.testFrames ? frameMarkup(&#x27;focus&#x27;, &#x27;Focus&#x27;, visualState === &#x27;injured&#x27; ? 76 : 158, 88, Math.min(scale, 1), visualState) : &#x27;&#x27;}
        &lt;/svg&gt;`;
      }

      function renderWelcome() {
        view.innerHTML = `&lt;section class=&quot;msuf-welcome&quot;&gt;
          &lt;div class=&quot;msuf-welcome-inner&quot;&gt;
            &lt;div class=&quot;msuf-welcome-mark&quot;&gt;${icon(&#x27;sparkles&#x27;)}&lt;/div&gt;
            &lt;div class=&quot;msuf-kicker text-small&quot;&gt;WELCOME TO MSUF&lt;/div&gt;
            &lt;h1&gt;Make MSUF yours&lt;/h1&gt;
            &lt;p class=&quot;msuf-welcome-copy&quot;&gt;Your frames are already functional. Personalize the essentials in about three minutes. Everything can be changed later.&lt;/p&gt;
            &lt;div class=&quot;viz-controls msuf-welcome-actions&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-action=&quot;start&quot;&gt;Start Quick Setup&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;import&quot;&gt;Import Profile&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;defaults&quot;&gt;Use Defaults&lt;/button&gt;
            &lt;/div&gt;
            &lt;div class=&quot;viz-controls msuf-welcome-secondary&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-action=&quot;advanced&quot;&gt;Open Advanced Settings&lt;/button&gt;
            &lt;/div&gt;
            &lt;p class=&quot;text-small text-muted&quot;&gt;Editing profile: Default · No changes are applied until you choose a setup option.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/section&gt;`;
      }

      function renderStart() {
        view.innerHTML = pageHeading(&#x27;Choose a starting point&#x27;, &#x27;Start from your current profile, recommended defaults, or an imported layout.&#x27;) + stepper() + `
          &lt;section class=&quot;card msuf-setup-card&quot;&gt;
            &lt;h2&gt;How should MSUF begin?&lt;/h2&gt;
            &lt;p&gt;Nothing changes until you continue, and every later option remains editable.&lt;/p&gt;
            &lt;div class=&quot;msuf-choice-list&quot; role=&quot;radiogroup&quot; aria-label=&quot;Starting point&quot;&gt;
              ${[
                [&#x27;current&#x27;, &#x27;Keep current settings&#x27;, &#x27;Use the active profile and personalize only what you choose.&#x27;],
                [&#x27;recommended&#x27;, &#x27;Recommended defaults&#x27;, &#x27;Apply MSUF’s balanced baseline before positioning frames.&#x27;],
                [&#x27;import&#x27;, &#x27;Import a profile&#x27;, &#x27;Load an existing profile, then jump directly to testing.&#x27;]
              ].map(([value, label, copy]) =&gt; `&lt;label class=&quot;form-check&quot;&gt;
                &lt;input class=&quot;form-check-input&quot; type=&quot;radio&quot; name=&quot;start-choice&quot; value=&quot;${value}&quot; ${state.startChoice === value ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                &lt;span class=&quot;form-check-label msuf-choice-copy&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;${copy}&lt;/span&gt;&lt;/span&gt;
              &lt;/label&gt;`).join(&#x27;&#x27;)}
            &lt;/div&gt;
            ${helpStrip()}
          &lt;/section&gt;` + actionBar(&#x27;Continue&#x27;);
      }

      function renderPosition() {
        view.innerHTML = pageHeading(&#x27;Position your frames&#x27;, &#x27;Place Player, Target and Focus where your eyes naturally rest in combat.&#x27;) + stepper() + `
          &lt;section class=&quot;card msuf-setup-card&quot;&gt;
            &lt;div class=&quot;msuf-split&quot;&gt;
              &lt;div class=&quot;msuf-controls&quot;&gt;
                &lt;h2&gt;Position your frames&lt;/h2&gt;
                &lt;p&gt;Use Edit Mode for broad placement. Drag the previews when Edit Mode is active.&lt;/p&gt;
                &lt;button type=&quot;button&quot; class=&quot;btn btn-primary btn-block&quot; data-action=&quot;edit&quot;&gt;${state.editMode ? &#x27;Finish Edit Mode&#x27; : &#x27;Start Edit Mode&#x27;}&lt;/button&gt;
                &lt;button type=&quot;button&quot; class=&quot;btn btn-block&quot; data-action=&quot;reset-position&quot;&gt;Reset positions&lt;/button&gt;
                &lt;label class=&quot;form-check form-switch&quot;&gt;
                  &lt;input id=&quot;msuf-test-frames&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot; ${state.testFrames ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                  &lt;span class=&quot;form-check-label&quot;&gt;Show test frames&lt;/span&gt;
                &lt;/label&gt;
                &lt;div class=&quot;msuf-divider&quot;&gt;&lt;/div&gt;
                &lt;p class=&quot;text-small text-muted&quot;&gt;You can fine-tune individual frames later.&lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;msuf-preview-field&quot;&gt;
                &lt;div class=&quot;msuf-preview-caption text-small&quot;&gt;&lt;span&gt;Live screen preview&lt;/span&gt;&lt;span&gt;${state.editMode ? &#x27;Edit Mode active&#x27; : &#x27;Preview only&#x27;}&lt;/span&gt;&lt;/div&gt;
                ${previewSvg(&#x27;healthy&#x27;)}
              &lt;/div&gt;
            &lt;/div&gt;
            ${helpStrip()}
          &lt;/section&gt;` + actionBar(&#x27;Looks good&#x27;);
      }

      function renderReadability() {
        const styleCopy = {
          compact: &#x27;Smaller frame and restrained text for minimal layouts.&#x27;,
          balanced: &#x27;Recommended proportions with clear health and name text.&#x27;,
          detailed: &#x27;More generous scale and stronger information density.&#x27;
        };
        view.innerHTML = pageHeading(&#x27;Make frames readable&#x27;, &#x27;Choose a visual baseline, then adjust scale and text without leaving the preview.&#x27;) + stepper() + `
          &lt;section class=&quot;card msuf-setup-card&quot;&gt;
            &lt;div class=&quot;msuf-split&quot;&gt;
              &lt;div class=&quot;msuf-controls&quot;&gt;
                &lt;h2&gt;Starting style&lt;/h2&gt;
                &lt;div class=&quot;msuf-choice-list&quot; role=&quot;radiogroup&quot; aria-label=&quot;Starting style&quot;&gt;
                  ${[&#x27;compact&#x27;, &#x27;balanced&#x27;, &#x27;detailed&#x27;].map(value =&gt; `&lt;label class=&quot;form-check&quot;&gt;
                    &lt;input class=&quot;form-check-input&quot; type=&quot;radio&quot; name=&quot;style-choice&quot; value=&quot;${value}&quot; ${state.style === value ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                    &lt;span class=&quot;form-check-label msuf-choice-copy&quot;&gt;&lt;span&gt;${value[0].toUpperCase() + value.slice(1)}${value === &#x27;balanced&#x27; ? &#x27; · Recommended&#x27; : &#x27;&#x27;}&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;${styleCopy[value]}&lt;/span&gt;&lt;/span&gt;
                  &lt;/label&gt;`).join(&#x27;&#x27;)}
                &lt;/div&gt;
                &lt;label class=&quot;form-label&quot; for=&quot;msuf-frame-scale&quot;&gt;Frame scale · &lt;span id=&quot;msuf-frame-scale-value&quot;&gt;${state.frameScale}%&lt;/span&gt;&lt;/label&gt;
                &lt;input id=&quot;msuf-frame-scale&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;80&quot; max=&quot;115&quot; step=&quot;5&quot; value=&quot;${state.frameScale}&quot;&gt;
                &lt;label class=&quot;form-label&quot; for=&quot;msuf-text-size&quot;&gt;Text size · &lt;span id=&quot;msuf-text-size-value&quot;&gt;${state.textSize}&lt;/span&gt;&lt;/label&gt;
                &lt;input id=&quot;msuf-text-size&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;11&quot; max=&quot;18&quot; step=&quot;1&quot; value=&quot;${state.textSize}&quot;&gt;
              &lt;/div&gt;
              &lt;div class=&quot;msuf-preview-field&quot;&gt;
                &lt;div class=&quot;msuf-preview-caption text-small&quot;&gt;&lt;span&gt;Player and Target preview&lt;/span&gt;&lt;span&gt;${state.style[0].toUpperCase() + state.style.slice(1)}&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;msuf-readability-preview&quot;&gt;
                  &lt;div class=&quot;msuf-readable-frame&quot; id=&quot;msuf-readable-frame&quot; style=&quot;--frame-scale:${state.frameScale / 100}&quot;&gt;
                    &lt;div class=&quot;msuf-readable-title&quot;&gt;&lt;span&gt;Player&lt;/span&gt;&lt;span&gt;Level 80&lt;/span&gt;&lt;/div&gt;
                    &lt;div class=&quot;msuf-readable-health&quot; id=&quot;msuf-readable-health&quot; style=&quot;font-size:${state.textSize}px&quot;&gt;&lt;span&gt;Marco&lt;/span&gt;&lt;span&gt;540.2k · 100%&lt;/span&gt;&lt;/div&gt;
                    &lt;div class=&quot;msuf-readable-power&quot;&gt;&lt;/div&gt;
                  &lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            ${helpStrip()}
          &lt;/section&gt;` + actionBar(&#x27;Continue&#x27;);
      }

      function renderCombat() {
        view.innerHTML = pageHeading(&#x27;Choose combat information&#x27;, &#x27;Tell MSUF what you play, then keep only the signals that help you react.&#x27;) + stepper() + `
          &lt;section class=&quot;card msuf-setup-card&quot;&gt;
            &lt;div class=&quot;msuf-split&quot;&gt;
              &lt;div&gt;
                &lt;h2&gt;What do you mainly play?&lt;/h2&gt;
                &lt;div class=&quot;msuf-choice-list&quot; role=&quot;radiogroup&quot; aria-label=&quot;Content focus&quot;&gt;
                  ${[
                    [&#x27;dungeons&#x27;, &#x27;Dungeons&#x27;], [&#x27;raids&#x27;, &#x27;Raids&#x27;], [&#x27;pvp&#x27;, &#x27;PvP&#x27;], [&#x27;mixed&#x27;, &#x27;Mixed&#x27;]
                  ].map(([value, label]) =&gt; `&lt;label class=&quot;form-check&quot;&gt;
                    &lt;input class=&quot;form-check-input&quot; type=&quot;radio&quot; name=&quot;focus-choice&quot; value=&quot;${value}&quot; ${state.focus === value ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                    &lt;span class=&quot;form-check-label&quot;&gt;${label}&lt;/span&gt;
                  &lt;/label&gt;`).join(&#x27;&#x27;)}
                &lt;/div&gt;
                &lt;div class=&quot;msuf-section-label text-small&quot;&gt;AURA PRESET&lt;/div&gt;
                &lt;div class=&quot;msuf-choice-list&quot; role=&quot;radiogroup&quot; aria-label=&quot;Aura preset&quot;&gt;
                  ${[
                    [&#x27;clean&#x27;, &#x27;Clean&#x27;], [&#x27;focused&#x27;, &#x27;Focused&#x27;], [&#x27;fast&#x27;, &#x27;Fast&#x27;]
                  ].map(([value, label]) =&gt; `&lt;label class=&quot;form-check&quot;&gt;
                    &lt;input class=&quot;form-check-input&quot; type=&quot;radio&quot; name=&quot;aura-choice&quot; value=&quot;${value}&quot; ${state.auraPreset === value ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                    &lt;span class=&quot;form-check-label&quot;&gt;${label}&lt;/span&gt;
                  &lt;/label&gt;`).join(&#x27;&#x27;)}
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;msuf-controls&quot;&gt;
                &lt;h2&gt;Recommended signals&lt;/h2&gt;
                &lt;label class=&quot;form-check form-switch&quot;&gt;
                  &lt;input id=&quot;msuf-cast-bars&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot; ${state.castBars ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                  &lt;span class=&quot;form-check-label&quot;&gt;Important cast bars&lt;/span&gt;
                &lt;/label&gt;
                &lt;label class=&quot;form-check form-switch&quot;&gt;
                  &lt;input id=&quot;msuf-group-frames&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot; ${state.groupFrames ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                  &lt;span class=&quot;form-check-label&quot;&gt;Party/Raid frames&lt;/span&gt;
                &lt;/label&gt;
                &lt;label class=&quot;form-check form-switch&quot;&gt;
                  &lt;input id=&quot;msuf-class-resources&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot; ${state.classResources ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                  &lt;span class=&quot;form-check-label&quot;&gt;Class Resources&lt;/span&gt;
                &lt;/label&gt;
                &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;diff&quot;&gt;See what changes&lt;/button&gt;
                &lt;div class=&quot;msuf-diff-list&quot; id=&quot;msuf-combat-diff&quot; hidden&gt;
                  &lt;div class=&quot;msuf-diff-row&quot;&gt;${icon(&#x27;check&#x27;)}&lt;span&gt;Target casts remain prominent.&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;msuf-diff-row&quot;&gt;${icon(&#x27;check&#x27;)}&lt;span&gt;${state.auraPreset[0].toUpperCase() + state.auraPreset.slice(1)} aura preset will be used.&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;msuf-diff-row&quot;&gt;${icon(&#x27;check&#x27;)}&lt;span&gt;Recommendations are saved to profile Default.&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            ${helpStrip()}
          &lt;/section&gt;` + actionBar(&#x27;Review setup&#x27;);
      }

      function renderTest() {
        const states = [
          [&#x27;healthy&#x27;, &#x27;Healthy&#x27;], [&#x27;injured&#x27;, &#x27;Injured&#x27;], [&#x27;casting&#x27;, &#x27;Casting&#x27;], [&#x27;dispellable&#x27;, &#x27;Dispellable&#x27;], [&#x27;dead&#x27;, &#x27;Dead&#x27;]
        ];
        view.innerHTML = pageHeading(&#x27;Test and finish&#x27;, &#x27;Preview common combat states before saving the setup as complete.&#x27;) + stepper() + `
          &lt;section class=&quot;card msuf-setup-card&quot;&gt;
            &lt;div class=&quot;msuf-preview-caption&quot;&gt;&lt;h2&gt;Combat-state preview&lt;/h2&gt;&lt;span class=&quot;viz-badge&quot;&gt;${state.imported ? &#x27;Imported profile&#x27; : &#x27;Profile: Default&#x27;}&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Preview state&quot;&gt;
              ${states.map(([value, label]) =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn${state.testState === value ? &#x27; is-selected&#x27; : &#x27;&#x27;}&quot; data-test-state=&quot;${value}&quot; aria-pressed=&quot;${state.testState === value}&quot;&gt;${label}&lt;/button&gt;`).join(&#x27;&#x27;)}
            &lt;/div&gt;
            &lt;div class=&quot;msuf-preview-field&quot;&gt;

      function renderComplete() {
        view.innerHTML = `&lt;section class=&quot;msuf-finish&quot;&gt;
          &lt;div&gt;
            &lt;div class=&quot;msuf-finish-icon&quot;&gt;${icon(&#x27;check&#x27;)}&lt;/div&gt;
            &lt;div class=&quot;msuf-kicker text-small&quot;&gt;SETUP COMPLETE&lt;/div&gt;
            &lt;h1&gt;Ready for combat&lt;/h1&gt;
            &lt;p class=&quot;text-muted&quot;&gt;Your onboarding choices are saved to profile “Default.”&lt;/p&gt;
            &lt;div class=&quot;viz-controls msuf-finish-actions&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-action=&quot;fine-tune&quot;&gt;Fine-tune settings&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;restore&quot;&gt;Restore previous setup&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-action=&quot;restart&quot;&gt;Restart Quick Setup&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;`;
      }

      function render() {
        if (state.mode === &#x27;welcome&#x27;) renderWelcome();
        else if (state.mode === &#x27;complete&#x27;) renderComplete();
        else if (state.step === 1) renderStart();
        else if (state.step === 2) renderPosition();
        else if (state.step === 3) renderReadability();
        else if (state.step === 4) renderCombat();
        else renderTest();
        bindInteractions();
        refreshIcons();
        window.setTimeout(refreshIcons, 0);
      }

      function moveStep(delta) {
        state.step = Math.max(1, Math.min(5, state.step + delta));
        state.mode = &#x27;setup&#x27;;
        setFeedback(`Step ${state.step} of 5 · ${steps[state.step - 1].label}`);
        render();
      }

      function bindDragPreview() {
        const svg = view.querySelector(&#x27;.msuf-preview-svg&#x27;);
        if (!svg || !state.editMode) return;
        let drag = null;

        function point(event) {
          const p = svg.createSVGPoint();
          p.x = event.clientX;
          p.y = event.clientY;
          const matrix = svg.getScreenCTM();
          return matrix ? p.matrixTransform(matrix.inverse()) : p;
        }

        svg.querySelectorAll(&#x27;.mock-frame&#x27;).forEach(frame =&gt; {
          frame.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
            const key = frame.dataset.frame;
            if (!key || !state.positions[key]) return;
            const current = point(event);
            drag = {
              key,
              frame,
              offsetX: current.x - state.positions[key].x,
              offsetY: current.y - state.positions[key].y
            };
            frame.classList.add(&#x27;is-dragging&#x27;);
            frame.setPointerCapture(event.pointerId);
          });
          frame.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
            if (!drag || drag.frame !== frame) return;
            const current = point(event);
            const x = Math.max(0, Math.min(500, current.x - drag.offsetX));
            const y = Math.max(0, Math.min(270, current.y - drag.offsetY));
            state.positions[drag.key] = { x, y };
            frame.setAttribute(&#x27;transform&#x27;, `translate(${x} ${y}) scale(${state.frameScale / 100})`);
            setFeedback(`${drag.key[0].toUpperCase() + drag.key.slice(1)} position updated`);
          });
          const finishDrag = event =&gt; {
            if (!drag || drag.frame !== frame) return;
            frame.classList.remove(&#x27;is-dragging&#x27;);
            if (frame.hasPointerCapture(event.pointerId)) frame.releasePointerCapture(event.pointerId);
            drag = null;
          };
          frame.addEventListener(&#x27;pointerup&#x27;, finishDrag);
          frame.addEventListener(&#x27;pointercancel&#x27;, finishDrag);
        });
      }

      function bindInteractions() {
        view.querySelectorAll(&#x27;[data-step]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            state.step = Number(button.dataset.step) || 1;
            state.mode = &#x27;setup&#x27;;
            setFeedback(`Opened ${steps[state.step - 1].label}`);
            render();
          });
        });

        view.querySelectorAll(&#x27;[data-action]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            const action = button.dataset.action;
            if (action === &#x27;start&#x27;) {
              state.mode = &#x27;setup&#x27;; state.step = 1; setFeedback(&#x27;Guided setup started&#x27;); render();
            } else if (action === &#x27;import&#x27;) {
              state.imported = true; state.mode = &#x27;setup&#x27;; state.step = 5; setFeedback(&#x27;Imported profile ready to test&#x27;); render();
            } else if (action === &#x27;defaults&#x27;) {
              state.startChoice = &#x27;recommended&#x27;; state.mode = &#x27;setup&#x27;; state.step = 2; setFeedback(&#x27;Recommended baseline selected&#x27;); render();
            } else if (action === &#x27;advanced&#x27; || action === &#x27;fine-tune&#x27;) {
              setFeedback(&#x27;Advanced settings remain available throughout setup&#x27;);
            } else if (action === &#x27;ask&#x27;) {
              setFeedback(`Assistant help opened for ${steps[state.step - 1].label}`);
            } else if (action === &#x27;exit&#x27;) {
              state.mode = &#x27;welcome&#x27;; setFeedback(&#x27;Setup saved for later&#x27;); render();
            } else if (action === &#x27;back&#x27;) {
              moveStep(-1);
            } else if (action === &#x27;keep&#x27;) {
              setFeedback(`Current ${steps[state.step - 1].label.toLowerCase()} settings accepted`);
              if (state.step &lt; 5) moveStep(1);
            } else if (action === &#x27;next&#x27;) {
              if (state.step === 5) {
                state.mode = &#x27;complete&#x27;; setFeedback(&#x27;Quick Setup complete&#x27;); render();
              } else {
                moveStep(1);
              }
            } else if (action === &#x27;edit&#x27;) {
              state.editMode = !state.editMode; setFeedback(state.editMode ? &#x27;Edit Mode active · drag a frame&#x27; : &#x27;Frame positions accepted&#x27;); render();
            } else if (action === &#x27;reset-position&#x27;) {
              state.positions = { player: { x: 64, y: 72 }, target: { x: 438, y: 72 }, focus: { x: 252, y: 222 } };
              setFeedback(&#x27;Frame positions reset&#x27;); render();
            } else if (action === &#x27;diff&#x27;) {
              const diff = view.querySelector(&#x27;#msuf-combat-diff&#x27;);
              if (diff) { diff.hidden = !diff.hidden; setFeedback(diff.hidden ? &#x27;Change details hidden&#x27; : &#x27;Change details shown&#x27;); }
            } else if (action === &#x27;restore&#x27;) {
              setFeedback(&#x27;Previous profile snapshot restored&#x27;);
            } else if (action === &#x27;restart&#x27;) {
              state.mode = &#x27;welcome&#x27;; state.step = 1; setFeedback(&#x27;Quick Setup restarted&#x27;); render();
            }
          });
        });

        view.querySelectorAll(&#x27;input[name=&quot;start-choice&quot;]&#x27;).forEach(input =&gt; {
          input.addEventListener(&#x27;change&#x27;, () =&gt; { state.startChoice = input.value; setFeedback(`${input.parentElement.textContent.trim().split(&#x27;\n&#x27;)[0]} selected`); });
        });
        view.querySelectorAll(&#x27;input[name=&quot;style-choice&quot;]&#x27;).forEach(input =&gt; {
          input.addEventListener(&#x27;change&#x27;, () =&gt; {
            state.style = input.value;
            if (input.value === &#x27;compact&#x27;) { state.frameScale = 90; state.textSize = 12; }
            if (input.value === &#x27;balanced&#x27;) { state.frameScale = 100; state.textSize = 14; }
            if (input.value === &#x27;detailed&#x27;) { state.frameScale = 110; state.textSize = 16; }
            setFeedback(`${input.value[0].toUpperCase() + input.value.slice(1)} style selected`); render();
          });
        });
        view.querySelectorAll(&#x27;input[name=&quot;focus-choice&quot;]&#x27;).forEach(input =&gt; {
          input.addEventListener(&#x27;change&#x27;, () =&gt; { state.focus = input.value; setFeedback(`${input.value[0].toUpperCase() + input.value.slice(1)} focus selected`); });
        });
        view.querySelectorAll(&#x27;input[name=&quot;aura-choice&quot;]&#x27;).forEach(input =&gt; {
          input.addEventListener(&#x27;change&#x27;, () =&gt; { state.auraPreset = input.value; setFeedback(`${input.value[0].toUpperCase() + input.value.slice(1)} aura preset selected`); });
        });
        view.querySelectorAll(&#x27;[data-test-state]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; { state.testState = button.dataset.testState || &#x27;healthy&#x27;; setFeedback(`${button.textContent.trim()} preview active`); render(); });
        });

        const testFrames = view.querySelector(&#x27;#msuf-test-frames&#x27;);
        if (testFrames) testFrames.addEventListener(&#x27;change&#x27;, () =&gt; { state.testFrames = testFrames.checked; setFeedback(state.testFrames ? &#x27;Test frames shown&#x27; : &#x27;Test frames hidden&#x27;); render(); });
        const castBars = view.querySelector(&#x27;#msuf-cast-bars&#x27;);
        if (castBars) castBars.addEventListener(&#x27;change&#x27;, () =&gt; { state.castBars = castBars.checked; setFeedback(`Cast bars ${state.castBars ? &#x27;enabled&#x27; : &#x27;disabled&#x27;}`); });
        const groupFrames = view.querySelector(&#x27;#msuf-group-frames&#x27;);
        if (groupFrames) groupFrames.addEventListener(&#x27;change&#x27;, () =&gt; { state.groupFrames = groupFrames.checked; setFeedback(`Group frames ${state.groupFrames ? &#x27;enabled&#x27; : &#x27;disabled&#x27;}`); });
        const classResources = view.querySelector(&#x27;#msuf-class-resources&#x27;);
        if (classResources) classResources.addEventListener(&#x27;change&#x27;, () =&gt; { state.classResources = classResources.checked; setFeedback(`Class Resources ${state.classResources ? &#x27;enabled&#x27; : &#x27;disabled&#x27;}`); });

        const frameScale = view.querySelector(&#x27;#msuf-frame-scale&#x27;);
        if (frameScale) frameScale.addEventListener(&#x27;input&#x27;, () =&gt; {
          state.frameScale = Number(frameScale.value);
          const value = view.querySelector(&#x27;#msuf-frame-scale-value&#x27;);
          const frame = view.querySelector(&#x27;#msuf-readable-frame&#x27;);
          if (value) value.textContent = `${state.frameScale}%`;
          if (frame) frame.style.setProperty(&#x27;--frame-scale&#x27;, state.frameScale / 100);
          setFeedback(`Frame scale set to ${state.frameScale}%`);
        });
        const textSize = view.querySelector(&#x27;#msuf-text-size&#x27;);
        if (textSize) textSize.addEventListener(&#x27;input&#x27;, () =&gt; {
          state.textSize = Number(textSize.value);
          const value = view.querySelector(&#x27;#msuf-text-size-value&#x27;);
          const health = view.querySelector(&#x27;#msuf-readable-health&#x27;);
          if (value) value.textContent = String(state.textSize);
          if (health) health.style.fontSize = `${state.textSize}px`;
          setFeedback(`Text size set to ${state.textSize}`);
        });

        bindDragPreview();
      }

      render();
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
