  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;msuf-onboarding-demo&#x27;);
      const view = document.getElementById(&#x27;msuf-onboarding-view&#x27;);
      const feedback = document.getElementById(&#x27;msuf-onboarding-feedback&#x27;);
      const announcer = document.getElementById(&#x27;msuf-onboarding-announcer&#x27;);
      const scenarioButtons = root ? root.querySelectorAll(&#x27;[data-scenario]&#x27;) : [];
      const resetPrototype = document.getElementById(&#x27;msuf-reset-prototype&#x27;);
      if (!root || !view || !feedback || !announcer) return;

      const steps = [
        { label: &#x27;Start&#x27;, icon: &#x27;play&#x27; },
        { label: &#x27;Position&#x27;, icon: &#x27;move&#x27; },
        { label: &#x27;Readability&#x27;, icon: &#x27;type&#x27; },
        { label: &#x27;Combat&#x27;, icon: &#x27;swords&#x27; },
        { label: &#x27;Test&#x27;, icon: &#x27;check&#x27; }
      ];

      const reviewSteps = [
        { label: &#x27;Profile protection&#x27;, icon: &#x27;shield-check&#x27; },
        { label: &#x27;Frame test&#x27;, icon: &#x27;scan-eye&#x27; },
        { label: &#x27;Explore 6.0&#x27;, icon: &#x27;sparkles&#x27; }
      ];

      const state = {
        scenario: &#x27;upgrade&#x27;,
        mode: &#x27;first-login&#x27;,
        combatEnded: false,
        reviewStep: 1,
        completionKind: &#x27;setup&#x27;,
        resumeMode: null,
        step: 1,
        startChoice: &#x27;current&#x27;,
        testFrames: true,
        editMode: false,
        style: &#x27;balanced&#x27;,
        frameScale: 100,
        textSize: 14,
        focus: &#x27;mixed&#x27;,
        auraPreset: &#x27;clean&#x27;,
        castBars: true,
        groupFrames: true,
        classResources: true,
        testState: &#x27;healthy&#x27;,
        imported: false,
        importValidated: false,
        positions: {
          player: { x: 64, y: 72 },
          target: { x: 438, y: 72 },
          focus: { x: 252, y: 222 }
        }
      };

      function icon(name) {
        return `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
      }

      function refreshIcons() {
        if (window.lucide &amp;&amp; typeof window.lucide.createIcons === &#x27;function&#x27;) {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      }

      function setFeedback(message) {
        feedback.textContent = message;
        announcer.textContent = message;
      }

      function pageHeading(title, copy) {
        return `
          &lt;div class=&quot;msuf-page-heading&quot;&gt;
            &lt;div class=&quot;msuf-heading-copy&quot;&gt;
              &lt;div class=&quot;msuf-kicker text-small&quot;&gt;QUICK SETUP&lt;/div&gt;
              &lt;h1&gt;${title}&lt;/h1&gt;
              &lt;p&gt;${copy}&lt;/p&gt;
            &lt;/div&gt;
            &lt;span class=&quot;viz-badge&quot;&gt;Step ${state.step} of 5&lt;/span&gt;
          &lt;/div&gt;`;
      }

      function stepper() {
        return `&lt;div class=&quot;msuf-stepper&quot; aria-label=&quot;Quick Setup progress&quot;&gt;
          ${steps.map((item, index) =&gt; {
            const number = index + 1;
            const complete = number &lt; state.step;
            const active = number === state.step;
            return `&lt;button type=&quot;button&quot; class=&quot;msuf-step${complete ? &#x27; is-complete&#x27; : &#x27;&#x27;}${active ? &#x27; is-active&#x27; : &#x27;&#x27;}&quot; data-step=&quot;${number}&quot; ${active ? &#x27;aria-current=&quot;step&quot;&#x27; : &#x27;&#x27;}&gt;
              &lt;span class=&quot;msuf-step-dot&quot;&gt;${complete ? icon(&#x27;check&#x27;) : icon(item.icon)}&lt;/span&gt;
              &lt;span&gt;${item.label}&lt;/span&gt;
            &lt;/button&gt;`;
          }).join(&#x27;&#x27;)}
        &lt;/div&gt;`;
      }

      function helpStrip() {
        return `&lt;div class=&quot;msuf-help-strip&quot;&gt;
          &lt;div class=&quot;msuf-help-copy&quot;&gt;${icon(&#x27;bot&#x27;)}&lt;span&gt;Need help with this step?&lt;/span&gt;&lt;/div&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;ask&quot;&gt;Ask MSUF&lt;/button&gt;
        &lt;/div&gt;`;
      }

      function actionBar(primaryLabel) {
        return `&lt;div class=&quot;msuf-actionbar&quot;&gt;

      function frameMarkup(key, label, health, power, scale, visualState) {
        const pos = state.positions[key];
        const healthClass = visualState === &#x27;injured&#x27; ? &#x27; injured&#x27; : visualState === &#x27;dead&#x27; ? &#x27; dead&#x27; : &#x27;&#x27;;
        const borderClass = visualState === &#x27;dispellable&#x27; ? &#x27; frame-dispel&#x27; : &#x27;&#x27;;
        const cast = visualState === &#x27;casting&#x27;;
        return `&lt;g class=&quot;mock-frame${state.editMode ? &#x27; is-editable&#x27; : &#x27;&#x27;}&quot; data-frame=&quot;${key}&quot; transform=&quot;translate(${pos.x} ${pos.y}) scale(${scale})&quot;&gt;
          &lt;rect class=&quot;frame-shell${borderClass}&quot; width=&quot;258&quot; height=&quot;88&quot; rx=&quot;7&quot;&gt;&lt;/rect&gt;
          &lt;rect class=&quot;frame-health${healthClass}&quot; x=&quot;12&quot; y=&quot;32&quot; width=&quot;${health}&quot; height=&quot;24&quot; rx=&quot;3&quot;&gt;&lt;/rect&gt;
          &lt;rect class=&quot;frame-power&quot; x=&quot;12&quot; y=&quot;61&quot; width=&quot;${power}&quot; height=&quot;7&quot; rx=&quot;2&quot;&gt;&lt;/rect&gt;
          ${cast ? &#x27;&lt;rect class=&quot;frame-cast&quot; x=&quot;12&quot; y=&quot;72&quot; width=&quot;172&quot; height=&quot;7&quot; rx=&quot;2&quot;&gt;&lt;/rect&gt;&#x27; : &#x27;&#x27;}
          &lt;text class=&quot;frame-name&quot; x=&quot;12&quot; y=&quot;22&quot;&gt;${label}&lt;/text&gt;
          &lt;text class=&quot;frame-value&quot; x=&quot;244&quot; y=&quot;49&quot; text-anchor=&quot;end&quot;&gt;${visualState === &#x27;dead&#x27; ? &#x27;Dead&#x27; : visualState === &#x27;injured&#x27; ? &#x27;38%&#x27; : &#x27;100%&#x27;}&lt;/text&gt;
          &lt;text class=&quot;frame-sub&quot; x=&quot;244&quot; y=&quot;22&quot; text-anchor=&quot;end&quot;&gt;${state.editMode ? &#x27;Drag to move&#x27; : &#x27;Preview&#x27;}&lt;/text&gt;
          ${state.editMode ? `
            &lt;rect class=&quot;handle&quot; x=&quot;-4&quot; y=&quot;-4&quot; width=&quot;8&quot; height=&quot;8&quot;&gt;&lt;/rect&gt;
            &lt;rect class=&quot;handle&quot; x=&quot;254&quot; y=&quot;-4&quot; width=&quot;8&quot; height=&quot;8&quot;&gt;&lt;/rect&gt;
            &lt;rect class=&quot;handle&quot; x=&quot;-4&quot; y=&quot;84&quot; width=&quot;8&quot; height=&quot;8&quot;&gt;&lt;/rect&gt;
            &lt;rect class=&quot;handle&quot; x=&quot;254&quot; y=&quot;84&quot; width=&quot;8&quot; height=&quot;8&quot;&gt;&lt;/rect&gt;` : &#x27;&#x27;}
        &lt;/g&gt;`;
      }

      function previewSvg(visualState = &#x27;healthy&#x27;) {

        return `&lt;svg class=&quot;msuf-preview-svg&quot; viewBox=&quot;0 0 760 360&quot; role=&quot;img&quot; aria-labelledby=&quot;msuf-preview-title msuf-preview-desc&quot;&gt;

          &lt;line class=&quot;guide-line&quot; x1=&quot;0&quot; y1=&quot;180&quot; x2=&quot;760&quot; y2=&quot;180&quot;&gt;&lt;/line&gt;
          ${frameMarkup(&#x27;player&#x27;, &#x27;Player&#x27;, visualState === &#x27;injured&#x27; ? 88 : 172, 118, scale, visualState)}

                    &lt;span class=&quot;form-check-label msuf-choice-copy&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;${copy}&lt;/span&gt;&lt;/span&gt;
                  &lt;/label&gt;`).join(&#x27;&#x27;)}
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;msuf-controls&quot;&gt;
                &lt;h2&gt;Recommended signals&lt;/h2&gt;
                &lt;label class=&quot;form-check form-switch&quot;&gt;
                  &lt;input id=&quot;msuf-cast-bars&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot; ${state.castBars ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                  &lt;span class=&quot;form-check-label&quot;&gt;Important cast bars&lt;/span&gt;
                &lt;/label&gt;
                &lt;label class=&quot;form-check form-switch&quot;&gt;
                  &lt;input id=&quot;msuf-group-frames&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot; ${state.groupFrames ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                  &lt;span class=&quot;form-check-label&quot;&gt;Party/Raid frames&lt;/span&gt;
                &lt;/label&gt;
                &lt;label class=&quot;form-check form-switch&quot;&gt;
                  &lt;input id=&quot;msuf-class-resources&quot; class=&quot;form-check-input&quot; type=&quot;checkbox&quot; ${state.classResources ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;
                  &lt;span class=&quot;form-check-label&quot;&gt;Class Resources&lt;/span&gt;
                &lt;/label&gt;
                &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;diff&quot;&gt;See what changes&lt;/button&gt;
                &lt;div class=&quot;msuf-diff-list&quot; id=&quot;msuf-combat-diff&quot; hidden&gt;
                  &lt;div class=&quot;msuf-diff-row&quot;&gt;${icon(&#x27;check&#x27;)}&lt;span&gt;Target casts remain prominent.&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;msuf-diff-row&quot;&gt;${icon(&#x27;check&#x27;)}&lt;span&gt;${state.auraPreset[0].toUpperCase() + state.auraPreset.slice(1)} aura preset will be used.&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;msuf-diff-row&quot;&gt;${icon(&#x27;check&#x27;)}&lt;span&gt;Recommendations are saved to profile Default.&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            ${helpStrip()}
          &lt;/section&gt;` + actionBar(&#x27;Review setup&#x27;);
      }

      function renderTest() {
        const states = [
          [&#x27;healthy&#x27;, &#x27;Healthy&#x27;], [&#x27;injured&#x27;, &#x27;Injured&#x27;], [&#x27;casting&#x27;, &#x27;Casting&#x27;], [&#x27;dispellable&#x27;, &#x27;Dispellable&#x27;], [&#x27;dead&#x27;, &#x27;Dead&#x27;]
        ];
        view.innerHTML = pageHeading(&#x27;Test and finish&#x27;, &#x27;Preview common combat states before saving the setup as complete.&#x27;) + stepper() + `
          &lt;section class=&quot;card msuf-setup-card&quot;&gt;
            &lt;div class=&quot;msuf-preview-caption&quot;&gt;&lt;h2&gt;Combat-state preview&lt;/h2&gt;&lt;span class=&quot;viz-badge&quot;&gt;${state.imported ? &#x27;Imported profile&#x27; : &#x27;Profile: Default&#x27;}&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Preview state&quot;&gt;
              ${states.map(([value, label]) =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn${state.testState === value ? &#x27; is-selected&#x27; : &#x27;&#x27;}&quot; data-test-state=&quot;${value}&quot; aria-pressed=&quot;${state.testState === value}&quot;&gt;${label}&lt;/button&gt;`).join(&#x27;&#x27;)}
            &lt;/div&gt;
            &lt;div class=&quot;msuf-preview-field&quot;&gt;
              ${previewSvg(state.testState)}
            &lt;/div&gt;
            ${helpStrip()}
          &lt;/section&gt;` + actionBar(&#x27;Finish&#x27;);
      }

      function renderLegacyComplete() {
        view.innerHTML = `&lt;section class=&quot;msuf-finish&quot;&gt;
          &lt;div&gt;
            &lt;div class=&quot;msuf-finish-icon&quot;&gt;${icon(&#x27;check&#x27;)}&lt;/div&gt;
            &lt;div class=&quot;msuf-kicker text-small&quot;&gt;SETUP COMPLETE&lt;/div&gt;
            &lt;h1&gt;Ready for combat&lt;/h1&gt;
            &lt;p class=&quot;text-muted&quot;&gt;Your onboarding choices are saved to profile “Default.”&lt;/p&gt;
            &lt;div class=&quot;viz-controls msuf-finish-actions&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-action=&quot;fine-tune&quot;&gt;Fine-tune settings&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-action=&quot;restore&quot;&gt;Restore previous setup&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-action=&quot;restart&quot;&gt;Restart Quick Setup&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;`;
      }

      function renderComplete() {
        const kept = state.completionKind === &#x27;kept&#x27;;
        const reviewed = state.completionKind === &#x27;reviewed&#x27;;
        const title = kept ? (state.scenario === &#x27;fresh&#x27; ? &#x27;Ready to play&#x27; : &#x27;Current setup kept&#x27;) : reviewed ? &#x27;MSUF 6.0 is ready&#x27; : &#x27;Ready for combat&#x27;;
        const copy = kept
          ? (state.scenario === &#x27;fresh&#x27; ? &#x27;Recommended frames stay active. No setup changes were applied.&#x27; : &#x27;Profile Default remains unchanged and your protected profiles stay available.&#x27;)
          : reviewed ? &#x27;Your current frames passed the review. No broad settings were applied.&#x27; : &#x27;Quick Setup is saved to profile Default. You can undo the entire setup session.&#x27;;
        view.innerHTML = `&lt;section class=&#x27;msuf-finish&#x27;&gt;
          &lt;div&gt;
            &lt;div class=&#x27;msuf-finish-icon&#x27;&gt;${icon(&#x27;check&#x27;)}&lt;/div&gt;
            &lt;div class=&#x27;msuf-kicker text-small&#x27;&gt;${kept ? &#x27;RESOLVED AS-IS&#x27; : reviewed ? &#x27;REVIEW COMPLETE&#x27; : &#x27;SETUP COMPLETE&#x27;}&lt;/div&gt;
            &lt;h1&gt;${title}&lt;/h1&gt;
            &lt;p class=&#x27;text-muted&#x27;&gt;${copy}&lt;/p&gt;
            ${kept ? `&lt;div class=&#x27;msuf-inline-notice&#x27;&gt;${icon(&#x27;shield-check&#x27;)} 0 settings changed · Profile Default kept&lt;/div&gt;` : reviewed ? `&lt;div class=&#x27;msuf-inline-notice&#x27;&gt;${icon(&#x27;check-circle-2&#x27;)} 3 checks complete · 0 broad changes&lt;/div&gt;` : `&lt;div class=&#x27;msuf-inline-notice&#x27;&gt;${icon(&#x27;check-circle-2&#x27;)} 4 settings adjusted · 3 current settings kept · Saved to Default&lt;/div&gt;`}
            &lt;div class=&#x27;viz-controls msuf-finish-actions&#x27;&gt;
              &lt;button type=&#x27;button&#x27; class=&#x27;btn btn-primary&#x27; data-action=&#x27;play&#x27;&gt;Finish &amp;amp; play&lt;/button&gt;
              &lt;button type=&#x27;button&#x27; class=&#x27;btn&#x27; data-action=&#x27;fine-tune&#x27;&gt;Fine-tune settings&lt;/button&gt;
              ${kept || reviewed ? &#x27;&#x27; : `&lt;button type=&#x27;button&#x27; class=&#x27;btn&#x27; data-action=&#x27;restore&#x27;&gt;Undo Quick Setup&lt;/button&gt;`}
              &lt;button type=&#x27;button&#x27; class=&#x27;btn btn-ghost&#x27; data-action=&#x27;restart&#x27;&gt;Restart&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;`;
      }

      function renderPlaying() {
        view.innerHTML = worldBackdrop(`&lt;div class=&#x27;msuf-quiet-reminder&#x27;&gt;${icon(&#x27;check-circle-2&#x27;)}&lt;span class=&#x27;text-small&#x27;&gt;&lt;strong&gt;MSUF 6.0 ready&lt;/strong&gt; · Onboarding complete&lt;/span&gt;&lt;button type=&#x27;button&#x27; class=&#x27;btn&#x27; data-action=&#x27;advanced&#x27;&gt;Open settings&lt;/button&gt;&lt;/div&gt;`);
      }

      function render() {
        const worldMode = state.mode === &#x27;first-login&#x27; || state.mode === &#x27;deferred&#x27; || state.mode === &#x27;playing&#x27;;
        root.classList.toggle(&#x27;is-world&#x27;, worldMode);
        scenarioButtons.forEach(button =&gt; {
          const selected = button.dataset.scenario === state.scenario;
          button.classList.toggle(&#x27;is-selected&#x27;, selected);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
        });

        if (state.mode === &#x27;first-login&#x27;) renderFirstLogin();
        else if (state.mode === &#x27;deferred&#x27;) renderDeferred();
        else if (state.mode === &#x27;playing&#x27;) renderPlaying();
        else if (state.mode === &#x27;welcome&#x27;) renderWelcome();
        else if (state.mode === &#x27;review&#x27;) renderReview();
        else if (state.mode === &#x27;whats-new&#x27;) renderWhatsNew();
        else if (state.mode === &#x27;complete&#x27;) renderComplete();
        else if (state.step === 1) renderStart();
        else if (state.step === 2) renderPosition();
        else if (state.step === 3) renderReadability();
        else if (state.step === 4) renderCombat();
        else renderTest();
        bindInteractions();
        refreshIcons();
        window.setTimeout(refreshIcons, 0);
      }

      function moveStep(delta) {
        state.editMode = false;
        state.step = Math.max(1, Math.min(5, state.step + delta));
        state.mode = &#x27;setup&#x27;;
        setFeedback(`Step ${state.step} of 5 · ${steps[state.step - 1].label}`);
        render();
      }

      function bindDragPreview() {
        const svg = view.querySelector(&#x27;.msuf-preview-svg&#x27;);
        if (!svg || !state.editMode) return;
        let drag = null;

        function point(event) {
          const p = svg.createSVGPoint();
          p.x = event.clientX;
          p.y = event.clientY;
          const matrix = svg.getScreenCTM();
          return matrix ? p.matrixTransform(matrix.inverse()) : p;
        }

        svg.querySelectorAll(&#x27;.mock-frame&#x27;).forEach(frame =&gt; {
          frame.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
            const key = frame.dataset.frame;
            if (!key || !state.positions[key]) return;
            const current = point(event);
            drag = {
              key,
              frame,
              offsetX: current.x - state.positions[key].x,
              offsetY: current.y - state.positions[key].y
            };
            frame.classList.add(&#x27;is-dragging&#x27;);
            frame.setPointerCapture(event.pointerId);
          });
          frame.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
            if (!drag || drag.frame !== frame) return;
            const current = point(event);
            const x = Math.max(0, Math.min(500, current.x - drag.offsetX));
            const y = Math.max(0, Math.min(270, current.y - drag.offsetY));
            state.positions[drag.key] = { x, y };
            frame.setAttribute(&#x27;transform&#x27;, `translate(${x} ${y}) scale(${state.frameScale / 100})`);
            setFeedback(`${drag.key[0].toUpperCase() + drag.key.slice(1)} position updated`);
          });
          const finishDrag = event =&gt; {
            if (!drag || drag.frame !== frame) return;
            frame.classList.remove(&#x27;is-dragging&#x27;);
            if (frame.hasPointerCapture(event.pointerId)) frame.releasePointerCapture(event.pointerId);
            drag = null;
          };
          frame.addEventListener(&#x27;pointerup&#x27;, finishDrag);
          frame.addEventListener(&#x27;pointercancel&#x27;, finishDrag);
        });
      }

      function resetExperience(scenario) {
        state.scenario = scenario || state.scenario;
        state.mode = state.scenario === &#x27;fresh&#x27; ? &#x27;welcome&#x27; : &#x27;first-login&#x27;;
        state.combatEnded = false;
        state.reviewStep = 1;
        state.completionKind = &#x27;setup&#x27;;
        state.step = 1;
        state.startChoice = state.scenario === &#x27;fresh&#x27; ? &#x27;recommended&#x27; : &#x27;current&#x27;;
        state.testFrames = true;
        state.editMode = false;
        state.style = &#x27;balanced&#x27;;
        state.frameScale = 100;
        state.textSize = 14;
        state.focus = &#x27;mixed&#x27;;
        state.auraPreset = &#x27;clean&#x27;;
        state.castBars = true;
        state.groupFrames = true;
        state.classResources = true;
        state.testState = &#x27;healthy&#x27;;
        state.imported = false;
        state.importValidated = false;
        state.resumeMode = null;
        state.positions = { player: { x: 64, y: 72 }, target: { x: 438, y: 72 }, focus: { x: 252, y: 222 } };
        setFeedback(state.scenario === &#x27;fresh&#x27; ? &#x27;Fresh install detected&#x27; : state.scenario === &#x27;combat&#x27; ? &#x27;Combat-safe launch state&#x27; : &#x27;Existing profiles detected&#x27;);
        render();
      }

      function handleAction(action, button) {
        if (action === &#x27;open-upgrade&#x27;) {
          state.mode = &#x27;welcome&#x27;; setFeedback(&#x27;Opened the protected upgrade review&#x27;); render();
        } else if (action === &#x27;combat-end&#x27;) {
          state.combatEnded = true; setFeedback(&#x27;Combat ended · setup waits for consent&#x27;); render();
        } else if (action === &#x27;later&#x27; || action === &#x27;exit&#x27;) {
          state.resumeMode = action === &#x27;exit&#x27; ? &#x27;setup&#x27; : state.mode;
          state.mode = &#x27;deferred&#x27;; setFeedback(&#x27;Setup saved for later · no automatic reopen&#x27;); render();
        } else if (action === &#x27;resume&#x27;) {
          state.mode = state.resumeMode === &#x27;setup&#x27; || state.resumeMode === &#x27;review&#x27; ? state.resumeMode : &#x27;welcome&#x27;;
          setFeedback(&#x27;Setup resumed&#x27;); render();
        } else if (action === &#x27;dismiss-reminder&#x27;) {
          const reminder = button.closest(&#x27;.msuf-quiet-reminder&#x27;);
          if (reminder) reminder.remove();
          setFeedback(&#x27;Dashboard reminder remains available&#x27;);
        } else if (action === &#x27;review&#x27;) {
          state.mode = &#x27;review&#x27;; state.reviewStep = 1; setFeedback(&#x27;Read-only profile review started&#x27;); render();
        } else if (action === &#x27;review-next&#x27;) {
          if (state.reviewStep &lt; 3) {
            state.reviewStep += 1; setFeedback(`Review ${state.reviewStep} of 3`); render();
          } else {
            state.completionKind = &#x27;reviewed&#x27;; state.mode = &#x27;complete&#x27;; setFeedback(&#x27;6.0 review complete&#x27;); render();
          }
        } else if (action === &#x27;review-back&#x27;) {
          state.reviewStep = Math.max(1, state.reviewStep - 1); setFeedback(`Review ${state.reviewStep} of 3`); render();
        } else if (action === &#x27;whats-new&#x27;) {
          state.mode = &#x27;whats-new&#x27;; setFeedback(&#x27;6.0 highlights opened · no settings changed&#x27;); render();
        } else if (action === &#x27;back-welcome&#x27;) {
          state.mode = &#x27;welcome&#x27;; setFeedback(&#x27;Returned to welcome&#x27;); render();
        } else if (action === &#x27;keep-current&#x27;) {
          state.completionKind = &#x27;kept&#x27;; state.mode = &#x27;complete&#x27;; setFeedback(&#x27;Current setup kept · no changes applied&#x27;); render();
        } else if (action === &#x27;start&#x27;) {
          state.mode = &#x27;setup&#x27;; state.step = 1; state.completionKind = &#x27;setup&#x27;;
          if (state.startChoice !== &#x27;import&#x27;) state.startChoice = state.scenario === &#x27;fresh&#x27; ? &#x27;recommended&#x27; : &#x27;current&#x27;;
          setFeedback(&#x27;Quick Setup opened · nothing applied yet&#x27;); render();
        } else if (action === &#x27;import&#x27;) {
          state.startChoice = &#x27;import&#x27;; state.importValidated = false; state.mode = &#x27;setup&#x27;; state.step = 1;
          setFeedback(&#x27;Import workspace opened · active profile unchanged&#x27;); render();
        } else if (action === &#x27;validate-import&#x27;) {
          const input = view.querySelector(&#x27;#msuf-import-string&#x27;);
          if (!input || !input.value.trim()) {
            setFeedback(&#x27;Paste a profile string before validation&#x27;);
          } else {
            state.importValidated = true; setFeedback(&#x27;Import validated · staged as Imported 6.0&#x27;); render();
          }
        } else if (action === &#x27;advanced&#x27; || action === &#x27;fine-tune&#x27;) {
          setFeedback(&#x27;Full settings would open here without losing onboarding progress&#x27;);
        } else if (action === &#x27;ask&#x27;) {
          setFeedback(`Optional Assistant help opened for ${steps[state.step - 1].label}`);
        } else if (action === &#x27;back&#x27;) {
          moveStep(-1);
        } else if (action === &#x27;keep&#x27;) {
          if (state.step &lt; 5) moveStep(1);
        } else if (action === &#x27;next&#x27;) {
          if (state.step === 1 &amp;&amp; state.startChoice === &#x27;import&#x27; &amp;&amp; !state.importValidated) {
            setFeedback(&#x27;Validate the imported profile before continuing&#x27;);
          } else if (state.step === 5) {
            state.editMode = false; state.mode = &#x27;complete&#x27;; state.completionKind = &#x27;setup&#x27;; setFeedback(&#x27;Quick Setup complete&#x27;); render();
          } else {
            if (state.step === 1 &amp;&amp; state.startChoice === &#x27;import&#x27;) state.imported = true;
            moveStep(1);
          }
        } else if (action === &#x27;edit&#x27;) {
          state.editMode = !state.editMode; setFeedback(state.editMode ? &#x27;Edit Mode active · drag a frame&#x27; : &#x27;Frame positions accepted&#x27;); render();
        } else if (action === &#x27;reset-position&#x27;) {
          state.positions = { player: { x: 64, y: 72 }, target: { x: 438, y: 72 }, focus: { x: 252, y: 222 } };
          setFeedback(&#x27;Frame positions reset&#x27;); render();
        } else if (action === &#x27;diff&#x27;) {
          const diff = view.querySelector(&#x27;#msuf-combat-diff&#x27;);
          if (diff) { diff.hidden = !diff.hidden; setFeedback(diff.hidden ? &#x27;Change details hidden&#x27; : &#x27;Change details shown&#x27;); }
        } else if (action === &#x27;restore&#x27;) {
          state.completionKind = &#x27;kept&#x27;; setFeedback(&#x27;Pre-setup profile snapshot restored&#x27;); render();
        } else if (action === &#x27;restart&#x27;) {
          state.mode = &#x27;welcome&#x27;; state.step = 1; state.reviewStep = 1; state.importValidated = false; setFeedback(&#x27;Onboarding restarted&#x27;); render();
        } else if (action === &#x27;play&#x27;) {
          state.mode = &#x27;playing&#x27;; setFeedback(&#x27;Onboarding complete&#x27;); render();
        } else if (action === &#x27;defaults&#x27;) {
          state.startChoice = &#x27;recommended&#x27;; state.mode = &#x27;setup&#x27;; state.step = 1; setFeedback(&#x27;Recommended baseline staged&#x27;); render();
        } else {
          return false;
        }
        return true;
      }

      function bindInteractions() {
        view.querySelectorAll(&#x27;[data-step]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            const targetStep = Number(button.dataset.step) || 1;
            if (targetStep &gt; state.step) {
              setFeedback(&#x27;Finish the current step before jumping ahead&#x27;);
              return;
            }
            state.step = targetStep;
            state.mode = &#x27;setup&#x27;;
            setFeedback(`Opened ${steps[state.step - 1].label}`);
            render();
          });
        });

        view.querySelectorAll(&#x27;[data-action]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            const action = button.dataset.action;
            if (handleAction(action, button)) return;
            if (action === &#x27;start&#x27;) {
              state.mode = &#x27;setup&#x27;; state.step = 1; setFeedback(&#x27;Guided setup started&#x27;); render();
            } else if (action === &#x27;import&#x27;) {
              state.imported = true; state.mode = &#x27;setup&#x27;; state.step = 5; setFeedback(&#x27;Imported profile ready to test&#x27;); render();
            } else if (action === &#x27;defaults&#x27;) {
              state.startChoice = &#x27;recommended&#x27;; state.mode = &#x27;setup&#x27;; state.step = 2; setFeedback(&#x27;Recommended baseline selected&#x27;); render();
            } else if (action === &#x27;advanced&#x27; || action === &#x27;fine-tune&#x27;) {
              setFeedback(&#x27;Advanced settings remain available throughout setup&#x27;);
            } else if (action === &#x27;ask&#x27;) {
              setFeedback(`Assistant help opened for ${steps[state.step - 1].label}`);
            } else if (action === &#x27;exit&#x27;) {
              state.mode = &#x27;welcome&#x27;; setFeedback(&#x27;Setup saved for later&#x27;); render();
            } else if (action === &#x27;back&#x27;) {
              moveStep(-1);
            } else if (action === &#x27;keep&#x27;) {
              setFeedback(`Current ${steps[state.step - 1].label.toLowerCase()} settings accepted`);
              if (state.step &lt; 5) moveStep(1);
            } else if (action === &#x27;next&#x27;) {
              if (state.step === 5) {
                state.mode = &#x27;complete&#x27;; setFeedback(&#x27;Quick Setup complete&#x27;); render();
              } else {
                moveStep(1);
              }
            } else if (action === &#x27;edit&#x27;) {
              state.editMode = !state.editMode; setFeedback(state.editMode ? &#x27;Edit Mode active · drag a frame&#x27; : &#x27;Frame positions accepted&#x27;); render();
            } else if (action === &#x27;reset-position&#x27;) {
              state.positions = { player: { x: 64, y: 72 }, target: { x: 438, y: 72 }, focus: { x: 252, y: 222 } };
              setFeedback(&#x27;Frame positions reset&#x27;); render();
            } else if (action === &#x27;diff&#x27;) {
              const diff = view.querySelector(&#x27;#msuf-combat-diff&#x27;);
              if (diff) { diff.hidden = !diff.hidden; setFeedback(diff.hidden ? &#x27;Change details hidden&#x27; : &#x27;Change details shown&#x27;); }
            } else if (action === &#x27;restore&#x27;) {
              setFeedback(&#x27;Previous profile snapshot restored&#x27;);
            } else if (action === &#x27;restart&#x27;) {
              state.mode = &#x27;welcome&#x27;; state.step = 1; setFeedback(&#x27;Quick Setup restarted&#x27;); render();
            }
          });
        });

        view.querySelectorAll(&#x27;input[name=&quot;start-choice&quot;]&#x27;).forEach(input =&gt; {
          input.addEventListener(&#x27;change&#x27;, () =&gt; {
            state.startChoice = input.value;
            if (input.value !== &#x27;import&#x27;) state.importValidated = false;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    return tooltip;

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {

    }
  };

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,

              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

    }

    }

  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

    }

    const trigger = getTrigger(event.target);

    }

    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });

&lt;/script&gt;
