name: MSUF Static Checks

on:
  push:
    branches:
      - main
      - 6.0-beta-branch
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Run static checks
        run: python3 .github/scripts/msuf_static_checks.py
      - name: Run core Lua 5.1 smokes
        shell: pwsh
        run: ./tools/run-core-smoke-tests.ps1 -LuaCommand lua5.1
