name: Correct MSUF Classic CurseForge game versions
run-name: Correct CurseForge file from ${{ github.ref_name }}

on:
  push:
    tags:
      - "classic-cfmeta-*"

permissions:
  contents: read

jobs:
  update-file:
    if: github.repository == 'Mapkov2/MidnightSimpleUnitFrames'
    runs-on: ubuntu-latest
    env:
      CLASSIC_METADATA_TAG: ${{ github.ref_name }}
      CF_API_KEY: ${{ secrets.CF_API_KEY || secrets.CURSEFORGE }}

    steps:
      - name: Check out metadata correction tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate correction target
        id: target
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:CLASSIC_METADATA_TAG
          if ($tag -notmatch '^classic-cfmeta-(?<file>\d+)-v(?<version>\d+(?:\.\d+)*-alpha(?<number>\d+))(?:-r\d+)?$') {
            throw "Metadata correction tag must use 'classic-cfmeta-<file>-v<version>-alpha<number>[-r<revision>]'. Got: $tag"
          }
          $fileId = $Matches["file"]
          $version = $Matches["version"]
          $alphaNumber = [int]$Matches["number"]

          git fetch --no-tags origin "+refs/heads/classic:refs/remotes/origin/classic"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/classic for metadata correction validation."
          }
          $tagCommit = (git rev-list -n 1 "refs/tags/$tag" 2>$null).Trim()
          $classicCommit = (git rev-parse "refs/remotes/origin/classic" 2>$null).Trim()
          if ([string]::IsNullOrWhiteSpace($tagCommit) -or [string]::IsNullOrWhiteSpace($classicCommit) -or $tagCommit -ne $classicCommit) {
            throw "Metadata correction tag '$tag' must point at current origin/classic. Tag=$tagCommit Classic=$classicCommit"
          }

          $sourceVersion = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          if ($sourceVersion -ne $version) {
            throw "VERSION '$sourceVersion' does not match metadata correction version '$version'."
          }

          $base = $version -replace '-alpha\d+$', ''
          $displayName = "MSUF_${base}A$alphaNumber"
          "CF_FILE_ID=$fileId" >> $env:GITHUB_ENV
          "CF_DISPLAY_NAME=$displayName" >> $env:GITHUB_ENV
          "file_id=$fileId" >> $env:GITHUB_OUTPUT
          "display_name=$displayName" >> $env:GITHUB_OUTPUT
          Write-Host "Validated metadata correction for CurseForge file $fileId at origin/classic $classicCommit."

      - name: Update existing CurseForge file
        id: curseforge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CF_API_KEY)) {
            throw "Missing CurseForge secret CF_API_KEY (or CURSEFORGE fallback)."
          }

          $headers = @{
            "X-Api-Token" = $env:CF_API_KEY
            Accept = "application/json"
          }
          $clientMatrix = @(Import-Csv -LiteralPath "tools/classic-client-matrix.tsv" -Delimiter "`t")
          if ($clientMatrix.Count -eq 0) {
            throw "tools/classic-client-matrix.tsv names no clients."
          }
          $versionResponse = Invoke-RestMethod `
            -Method Get `
            -Uri "https://wow.curseforge.com/api/game/versions" `
            -Headers $headers
          $availableVersions = @(
            foreach ($entry in $versionResponse) { $entry }
          )
          # The matrix names the game versions; "1.6*" follows the newest WoW Forever patch CurseForge lists.
          $gameVersionNames = @(& "./.github/scripts/resolve_release_game_versions.ps1" `
            -ClientMatrixPath "tools/classic-client-matrix.tsv" `
            -AvailableNames @(foreach ($entry in $availableVersions) { [string]$entry.name }))
          "game_versions=$($gameVersionNames -join ', ')" >> $env:GITHUB_OUTPUT
          $gameVersionIds = @(
            foreach ($name in $gameVersionNames) {
              $matches = @($availableVersions | Where-Object { $_.name -eq $name })
              if ($matches.Count -ne 1) {
                throw "CurseForge game version '$name' resolved to $($matches.Count) entries; expected exactly one."
              }
              Write-Host "Resolved CurseForge game version $name -> ID $($matches[0].id), type $($matches[0].gameVersionTypeID)."
              [long]$matches[0].id
            }
          )
          $metadata = [ordered]@{
            fileID = [long]$env:CF_FILE_ID
            displayName = $env:CF_DISPLAY_NAME
            gameVersions = $gameVersionIds
            releaseType = "alpha"
          } | ConvertTo-Json -Depth 4 -Compress

          $result = Invoke-RestMethod `
            -Method Post `
            -Uri "https://wow.curseforge.com/api/projects/1384660/update-file" `
            -Headers $headers `
            -Form @{ metadata = $metadata }

          if (-not $result -or [string]$result.id -ne [string]$env:CF_FILE_ID) {
            throw "CurseForge did not confirm metadata correction for file $env:CF_FILE_ID."
          }
          "updated_file_id=$($result.id)" >> $env:GITHUB_OUTPUT
          Write-Host "CurseForge file $($result.id) now targets [$($gameVersionNames -join ', ')] as '$env:CF_DISPLAY_NAME' / alpha."

      - name: Write correction summary
        shell: pwsh
        run: |
          @"
          ## CurseForge file metadata corrected

          - File: ``${{ steps.curseforge.outputs.updated_file_id }}``
          - Display name: ``$env:CF_DISPLAY_NAME``
          - Game versions: ``${{ steps.curseforge.outputs.game_versions }}``
          - Release type: ``alpha``
          - No new file was uploaded.
          "@ >> $env:GITHUB_STEP_SUMMARY
