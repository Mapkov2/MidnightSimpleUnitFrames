name: MSUF

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string
      prerelease:
        description: Publish as beta on Wago and CurseForge
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag_name }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease || inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}

      - name: Build AddOns zip
        shell: pwsh
        run: |
          ./tools/package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: CHANGELOG.md

      - name: Upload to Wago
        shell: pwsh
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          $zip = Get-ChildItem -Path dist -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "No release zip found in dist."
          }

          $publishArgs = @("-Version", $env:RELEASE_VERSION, "-ZipPath", $zip.FullName)
          if ($env:RELEASE_IS_PRERELEASE -eq "true") {
            $publishArgs += "-Prerelease"
          }

          ./tools/publish-wago.ps1 @publishArgs

      - name: Upload to CurseForge
        shell: pwsh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION_IDS: ${{ vars.CF_GAME_VERSION_IDS }}
        run: |
          $zip = Get-ChildItem -Path dist -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "No release zip found in dist."
          }

          $publishArgs = @("-Version", $env:RELEASE_VERSION, "-ZipPath", $zip.FullName)
          if ($env:RELEASE_IS_PRERELEASE -eq "true") {
            $publishArgs += "-Prerelease"
          }

          ./tools/publish-curseforge.ps1 @publishArgs
