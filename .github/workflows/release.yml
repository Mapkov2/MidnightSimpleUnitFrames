name: MSUF

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AddOns zip
        shell: pwsh
        run: |
          ./tools/package-release.ps1 -Version $env:GITHUB_REF_NAME

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
