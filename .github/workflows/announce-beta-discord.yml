name: Announce MSUF beta in Discord
run-name: Announce ${{ inputs.tag }} in Discord

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published MSUF 7.0 beta tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: discord-beta-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  announce:
    if: github.repository == 'Mapkov2/MidnightSimpleUnitFrames' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare the published beta changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^classic-v7\.[0-9]+(\.[0-9]+)?-beta[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
            jq -e --arg tag "$RELEASE_TAG" '
              select(.tag_name == $tag and .prerelease and (.draft | not))
              | select(any(.assets[]; .state == "uploaded" and (.name | endswith(".zip"))))
              | .body |= gsub("(?s)<!--.*?-->"; "")
              | select((.body | length) > 0 and (.body | length) <= 4096)
              | {allowed_mentions: {parse: []}, embeds: [{title: .name, url: .html_url, description: .body}]}
            ' > "$RUNNER_TEMP/msuf-discord-payload.json"
      - name: Post the changelog and verify the message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DISCORD_WEBHOOK" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo 'The Discord webhook is missing or invalid.' >&2; exit 1 ;;
          esac
          separator='?'
          if [[ "$DISCORD_WEBHOOK" == *\?* ]]; then separator='&'; fi
          guild=$(curl -fsS --max-time 30 "$DISCORD_WEBHOOK" | jq -er '.guild_id | select(test("^[0-9]+$"))')
          curl -fsS --max-time 30 --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/msuf-discord-payload.json" \
            "$DISCORD_WEBHOOK${separator}wait=true" > "$RUNNER_TEMP/msuf-discord-message.json"
          jq -er --arg guild "$guild" '
            select((.channel_id | test("^[0-9]+$")) and (.id | test("^[0-9]+$")))
            | "Discord announcement URL: https://discord.com/channels/\($guild)/\(.channel_id)/\(.id)"
          ' "$RUNNER_TEMP/msuf-discord-message.json"
