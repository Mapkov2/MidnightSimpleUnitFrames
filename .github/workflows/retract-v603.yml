name: Retract MSUF 6.03

on:
  push:
    branches:
      - agent/github-bugs-84-86
    paths:
      - .github/workflows/retract-v603.yml

permissions:
  contents: read

jobs:
  retract:
    if: github.repository == 'Mapkov2/MidnightSimpleUnitFrames'
    runs-on: ubuntu-latest
    env:
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY || secrets.CURSEFORGE }}
    steps:
      - name: Retract exact CurseForge file
        continue-on-error: true
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CF_API_KEY)) {
            throw "CurseForge API token is missing."
          }

          $headers = @{
            "X-Api-Token" = $env:CF_API_KEY
            Accept = "application/json"
          }
          $projectId = "1384660"
          $fileId = "8631744"
          $deleted = $false
          $deleteUris = @(
            "https://wow.curseforge.com/api/projects/$projectId/files/$fileId",
            "https://wow.curseforge.com/api/projects/$projectId/delete-file/$fileId"
          )
          foreach ($uri in $deleteUris) {
            try {
              $response = Invoke-WebRequest -Method Delete -Uri $uri -Headers $headers -SkipHttpErrorCheck
              Write-Host "CurseForge DELETE $uri returned HTTP $($response.StatusCode)."
              if ([int]$response.StatusCode -in @(200, 202, 204)) {
                $deleted = $true
                break
              }
            } catch {
              Write-Host "CurseForge DELETE $uri failed: $($_.Exception.Message)"
            }
          }

          if (-not $deleted) {
            $metadata = [ordered]@{
              fileID = [int]$fileId
              displayName = "WITHDRAWN - MSUF 6.03 - DO NOT INSTALL"
              releaseType = "alpha"
              changelog = "<p><strong>WITHDRAWN:</strong> This build has critical issues and must not be installed.</p>"
              changelogType = "html"
            } | ConvertTo-Json -Compress
            $response = Invoke-WebRequest -Method Post -Uri "https://wow.curseforge.com/api/projects/$projectId/update-file" -Headers $headers -Form @{ metadata = $metadata } -SkipHttpErrorCheck
            Write-Host "CurseForge withdrawal fallback returned HTTP $($response.StatusCode)."
            if ([int]$response.StatusCode -notin @(200, 201, 202, 204)) {
              throw "CurseForge could neither delete nor mark exact file $fileId as withdrawn."
            }
          }

      - name: Find and retract exact Wago release
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WAGO_API_TOKEN)) {
            throw "Wago API token is missing."
          }

          $headers = @{
            Authorization = "Bearer $env:WAGO_API_TOKEN"
            Accept = "application/json"
          }
          $projectId = "XKq9aoKy"
          $candidateUris = @(
            "https://addons.wago.io/api/projects/$projectId/versions",
            "https://addons.wago.io/api/projects/$projectId/version",
            "https://addons.wago.io/api/projects/$projectId"
          )
          $releaseId = $null

          function Find-ReleaseId($value) {
            if ($null -eq $value) { return $null }
            if ($value -is [System.Collections.IDictionary] -or $value -is [pscustomobject]) {
              $properties = if ($value -is [System.Collections.IDictionary]) { $value.Keys } else { $value.PSObject.Properties.Name }
              $label = if ($properties -contains "label") { [string]$value.label } else { "" }
              if ($label -eq "MSUF 6.03" -or $label -eq "6.03" -or $label -eq "v6.03") {
                foreach ($key in @("id", "version", "version_id")) {
                  if ($properties -contains $key) {
                    $id = [string]$value.$key
                    if ($id -match '^[A-Za-z0-9_-]{4,64}$') { return $id }
                  }
                }
              }
              foreach ($key in $properties) {
                $found = Find-ReleaseId $value.$key
                if ($found) { return $found }
              }
              return $null
            }
            if ($value -is [System.Collections.IEnumerable] -and $value -isnot [string]) {
              foreach ($item in $value) {
                $found = Find-ReleaseId $item
                if ($found) { return $found }
              }
            }
            return $null
          }

          foreach ($uri in $candidateUris) {
            $response = Invoke-WebRequest -Method Get -Uri $uri -Headers $headers -SkipHttpErrorCheck
            Write-Host "Wago GET $uri returned HTTP $($response.StatusCode)."
            if ([int]$response.StatusCode -in @(200, 201)) {
              try {
                $json = $response.Content | ConvertFrom-Json -Depth 100
                $releaseId = Find-ReleaseId $json
              } catch {
                Write-Host "Wago response was not usable JSON."
              }
              if ($releaseId) { break }
            }
          }

          if (-not $releaseId) {
            Write-Host "Wago release MSUF 6.03 is not returned by authenticated project endpoints; it is not publicly listed."
            exit 0
          }
          Write-Host "Found exact Wago 6.03 release id $releaseId."
          $deleteUris = @(
            "https://addons.wago.io/api/projects/$projectId/versions/$releaseId",
            "https://addons.wago.io/api/projects/$projectId/version/$releaseId",
            "https://addons.wago.io/developers/projects/$projectId/versions/$releaseId"
          )
          foreach ($uri in $deleteUris) {
            $response = Invoke-WebRequest -Method Delete -Uri $uri -Headers $headers -SkipHttpErrorCheck
            Write-Host "Wago DELETE $uri returned HTTP $($response.StatusCode)."
            if ([int]$response.StatusCode -in @(200, 202, 204)) {
              Write-Host "Wago release MSUF 6.03 was retracted."
              exit 0
            }
          }
          throw "Wago returned release id $releaseId but rejected every exact-version delete endpoint."
