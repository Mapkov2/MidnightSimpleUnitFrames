name: MSUF Classic full gate

# The full Classic gate as a reusable workflow, so the push/PR gate and the
# release both run the same steps instead of two copies that can drift.
# It checks out the commit the caller was triggered for (a branch head for the
# gate workflow, the release tag for the release workflow), resolves and checks
# out the Retail commit this tree mirrors, clones the Blizzard UI source mirror
# and runs the gate with the Retail reference.
#
# Every step fails closed. -RequireNoSkippedSteps makes the gate itself refuse
# to pass when any of its own steps was skipped, so a clone that lands in the
# wrong place cannot produce a green run that quietly dropped the Blizzard
# source audit or the Retail parity comparison.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit-ish to check out; defaults to the commit that triggered the caller."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The environment steps of the self-contained gate, pinned the same way.
      - name: Set up Python for the Classic gate
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1 for the Classic gate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          sudo ln -sf "$(command -v lua5.1)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.1)" /usr/local/bin/luac
          lua -v
          luac -v

      # Retail is branch main of this repository. No tracked file records the
      # main commit this tree mirrors, so the resolver derives it: the newest
      # main commit whose addon tree matches this one under the gate's own
      # rules. A blob-less clone holds every commit and tree the resolver reads;
      # the checkout then fetches the blobs of that one commit.
      - name: Check out the Retail commit this tree mirrors
        shell: pwsh
        env:
          MSUF_RETAIL_REFERENCE: ${{ runner.temp }}/msuf-classic-retail-ref
          MSUF_RETAIL_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git clone --filter=blob:none --no-checkout --single-branch --branch main $env:MSUF_RETAIL_REMOTE $env:MSUF_RETAIL_REFERENCE
          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone Retail main from $env:MSUF_RETAIL_REMOTE."
          }
          $resolved = & python ./.github/scripts/resolve_classic_retail_source.py --retail $env:MSUF_RETAIL_REFERENCE --retail-rev origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "No commit of Retail main matches this Classic tree; the resolver output above names the nearest one and its mismatching paths."
          }
          # The resolver prints its report on stderr and exactly one commit id
          # on stdout. Anything else means the Retail reference is unresolved,
          # and a release must fail closed rather than gate against a guess.
          $commits = @(@($resolved) | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ -cmatch '^[0-9a-f]{40}$' })
          if ($commits.Count -ne 1) {
            throw "The Retail source resolver printed $($commits.Count) commit ids instead of one; the Retail reference cannot be resolved."
          }
          $commit = $commits[0]
          git -C $env:MSUF_RETAIL_REFERENCE -c advice.detachedHead=false checkout --detach $commit
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check out Retail $commit."
          }
          $head = (git -C $env:MSUF_RETAIL_REFERENCE rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or ([string]$head).Trim() -cne $commit) {
            throw "Retail reference HEAD is '$head', not the resolved $commit."
          }
          "Full Classic gate against Retail main $commit" >> $env:GITHUB_STEP_SUMMARY

      # The audit reads Blizzard's branch tips through git only (show, grep,
      # rev-parse), so a depth-1 clone of every branch needs no working tree.
      # The tips are listed so a red audit names the branch that moved.
      - name: Clone the Blizzard UI source mirror
        shell: pwsh
        run: |
          $mirror = "_local_workflows/references/wow-ui-source"
          git clone --depth 1 --no-single-branch --no-checkout --origin upstream https://github.com/Gethe/wow-ui-source.git $mirror
          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone the Blizzard UI source mirror."
          }
          # The gate treats a missing mirror as a skippable step on a runner, so
          # the landing place is asserted here instead of discovered as a pass.
          if (-not (Test-Path -LiteralPath "$mirror/.git" -PathType Container)) {
            throw "The Blizzard UI source mirror did not land at $mirror/.git."
          }
          git -C $mirror for-each-ref "--format=%(refname:short) %(objectname:short) %(committerdate:short)" refs/remotes/upstream
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list the Blizzard UI source branches."
          }

      - name: Run the full Classic gate
        shell: pwsh
        env:
          MSUF_RETAIL_REFERENCE: ${{ runner.temp }}/msuf-classic-retail-ref
        run: |
          & ./tools/run-classic-gate.ps1 -RetailReferenceRoot $env:MSUF_RETAIL_REFERENCE -RequireNoSkippedSteps
          if ($LASTEXITCODE -ne 0) {
            throw "Classic full gate failed."
          }
