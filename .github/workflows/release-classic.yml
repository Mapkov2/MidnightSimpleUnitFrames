name: MSUF Classic CurseForge
run-name: Publish ${{ github.ref_name }} to CurseForge

on:
  push:
    tags:
      - "classic-v*"

permissions:
  contents: read

jobs:
  publish-classic:
    if: github.repository == 'Mapkov2/MidnightSimpleUnitFrames'
    runs-on: ubuntu-latest
    env:
      CLASSIC_RELEASE_TAG: ${{ github.ref_name }}
      # Presence only, never the token: the Wago upload step is the single step
      # that is handed WAGO_API_TOKEN, and a step `if:` cannot read `secrets`.
      WAGO_UPLOAD_ENABLED: ${{ secrets.WAGO_API_TOKEN != '' }}

    steps:
      - name: Check out Classic release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate Classic tag and branch freshness
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:CLASSIC_RELEASE_TAG
          # Version, display name and channel come from the shared resolver that
          # the packager and the metadata correction also use.
          $release = & "./.github/scripts/resolve_classic_release_channel.ps1" -Tag $tag
          $version = $release.Version

          git fetch --no-tags origin "+refs/heads/classic:refs/remotes/origin/classic"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/classic for release freshness validation."
          }

          $tagCommit = (git rev-list -n 1 "refs/tags/$tag" 2>$null)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
            throw "Could not resolve Classic release tag '$tag' to a commit."
          }
          $classicCommit = (git rev-parse "refs/remotes/origin/classic" 2>$null)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($classicCommit)) {
            throw "Could not resolve origin/classic to a commit."
          }

          $tagCommit = $tagCommit.Trim()
          $classicCommit = $classicCommit.Trim()
          if ($tagCommit -ne $classicCommit) {
            throw "Refusing Classic release tag '$tag' at $tagCommit; current origin/classic is $classicCommit."
          }

          $releaseName = $release.DisplayName
          $releaseType = $release.ReleaseType

          "CLASSIC_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "CLASSIC_RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
          "CLASSIC_RELEASE_TYPE=$releaseType" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "release_type=$releaseType" >> $env:GITHUB_OUTPUT
          Write-Host "Classic tag '$tag' is current at origin/classic $classicCommit."

      - name: Validate CurseForge publishing configuration
        shell: pwsh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY || secrets.CURSEFORGE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CF_API_KEY)) {
            throw "Missing CurseForge secret CF_API_KEY (or CURSEFORGE fallback)."
          }

      - name: Set up Python for the Classic gate
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1 for the Classic gate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          sudo ln -sf "$(command -v lua5.1)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.1)" /usr/local/bin/luac
          lua -v
          luac -v

      # The full gate also needs a clean Retail checkout and the Blizzard UI
      # source mirror, so it stays a local pre-tag step. -SelfContained runs
      # every check that needs neither: syntax, load order, error paths,
      # ownership manifests and the Lua smokes.
      - name: Run the self-contained Classic gate
        shell: pwsh
        run: |
          & ./tools/test-classic-prototype.ps1 -SelfContained
          if ($LASTEXITCODE -ne 0) {
            throw "Classic self-contained gate failed."
          }

      - name: Build and validate Classic multi-client package
        shell: pwsh
        run: |
          & "./.github/scripts/build_classic_release_package.ps1" `
            -ReleaseVersion $env:CLASSIC_RELEASE_TAG `
            -OutputDirectory "dist"
          if ($LASTEXITCODE -ne 0) {
            throw "Classic release package build failed."
          }

      - name: Upload Classic release to CurseForge
        id: curseforge
        shell: pwsh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY || secrets.CURSEFORGE }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-TocField {
            param(
              [Parameter(Mandatory = $true)][string]$Content,
              [Parameter(Mandatory = $true)][string]$Name
            )

            $matches = [regex]::Matches($Content, "(?m)^##\s+$([regex]::Escape($Name)):\s*(.+?)\s*$")
            if ($matches.Count -ne 1) {
              throw "Expected exactly one '$Name' field in Core Classic TOC; found $($matches.Count)."
            }
            return $matches[0].Groups[1].Value.Trim()
          }

          $expectedProjectId = "1384660"
          $clientMatrix = @(Import-Csv -LiteralPath "tools/classic-client-matrix.tsv" -Delimiter "`t")
          if ($clientMatrix.Count -eq 0) {
            throw "tools/classic-client-matrix.tsv names no clients."
          }
          $coreClassicTocs = @(
            foreach ($client in $clientMatrix) {
              if ($client.IsClassic -ceq "true") { "MidnightSimpleUnitFrames/MidnightSimpleUnitFrames_$($client.Suffix).toc" }
            }
          )
          if ($coreClassicTocs.Count -eq 0) {
            throw "tools/classic-client-matrix.tsv names no Classic client."
          }
          $projectIds = @(
            foreach ($tocPath in $coreClassicTocs) {
              if (-not (Test-Path -LiteralPath $tocPath -PathType Leaf)) {
                throw "Core Classic TOC is missing: $tocPath"
              }
              $tocContent = Get-Content -LiteralPath $tocPath -Raw
              Get-TocField -Content $tocContent -Name "X-Curse-Project-ID"
            }
          )
          $uniqueProjectIds = @($projectIds | Sort-Object -Unique)
          if ($uniqueProjectIds.Count -ne 1 -or $uniqueProjectIds[0] -ne $expectedProjectId) {
            throw "Core Classic TOCs must all declare CurseForge project $expectedProjectId. Got: $($projectIds -join ', ')"
          }
          $projectId = $uniqueProjectIds[0]

          $zips = @(Get-ChildItem -LiteralPath "dist" -Filter "*.zip" -File)
          if ($zips.Count -ne 1) {
            throw "Expected exactly one validated Classic release zip; found $($zips.Count)."
          }
          $zip = $zips[0]
          $changelogPath = "dist/RELEASE_NOTES_CLASSIC_CF.html"
          if (-not (Test-Path -LiteralPath $changelogPath -PathType Leaf)) {
            throw "Classic CurseForge HTML changelog is missing: $changelogPath"
          }
          $changelog = Get-Content -LiteralPath $changelogPath -Raw
          if ([string]::IsNullOrWhiteSpace($changelog)) {
            throw "Classic CurseForge HTML changelog is empty."
          }

          # The matrix names the game versions; "1.6*" follows the newest WoW Forever
          # patch CurseForge lists. Without the list, exact names upload unchanged.
          $availableNames = @()
          try {
            $versionResponse = Invoke-RestMethod -Method Get -Uri "https://wow.curseforge.com/api/game/versions" `
              -Headers @{ "X-Api-Token" = $env:CF_API_KEY; Accept = "application/json" }
            $availableNames = @(foreach ($entry in $versionResponse) { [string]$entry.name })
          } catch {
            Write-Host "::warning::Could not read the CurseForge game version list: $_"
          }
          $gameVersionNames = @(& "./.github/scripts/resolve_release_game_versions.ps1" `
            -ClientMatrixPath "tools/classic-client-matrix.tsv" -AvailableNames $availableNames)
          "game_versions=$($gameVersionNames -join ', ')" >> $env:GITHUB_OUTPUT
          $gameVersionNames = [string[]]$gameVersionNames
          Write-Host "CurseForge upload $($env:CLASSIC_RELEASE_NAME) type=$($env:CLASSIC_RELEASE_TYPE) zip=$($zip.Name) bytes=$($zip.Length) versions=[$($gameVersionNames -join ', ')]"
          $metadata = [ordered]@{
            changelog = $changelog
            changelogType = "html"
            displayName = $env:CLASSIC_RELEASE_NAME
            gameVersionNames = $gameVersionNames
            releaseType = $env:CLASSIC_RELEASE_TYPE
          } | ConvertTo-Json -Depth 5 -Compress

          $headers = @{
            "X-Api-Token" = $env:CF_API_KEY
            Accept = "application/json"
          }
          $form = @{
            metadata = $metadata
            file = Get-Item -LiteralPath $zip.FullName
          }
          try {
            $result = Invoke-RestMethod `
              -Method Post `
              -Uri "https://wow.curseforge.com/api/projects/$projectId/upload-file" `
              -Headers $headers `
              -Form $form
          } catch {
            $detail = $_.ErrorDetails.Message
            if ([string]::IsNullOrWhiteSpace($detail)) { $detail = [string]$_ }
            throw "CurseForge upload failed for '$($env:CLASSIC_RELEASE_NAME)' ($($env:CLASSIC_RELEASE_TYPE), versions [$($gameVersionNames -join ', ')]): $detail"
          }

          $fileId = if ($result -and $result.id) { [string]$result.id } else { "" }
          if ([string]::IsNullOrWhiteSpace($fileId)) {
            throw "CurseForge accepted no file ID for Classic release upload."
          }

          "file_id=$fileId" >> $env:GITHUB_OUTPUT
          Write-Host "CurseForge Classic $($env:CLASSIC_RELEASE_TYPE) upload accepted: project $projectId, file $fileId, release '$env:CLASSIC_RELEASE_NAME', versions [$($gameVersionNames -join ', ')]."

      # Wago takes the same zip. Each game version goes to the Wago flavor whose
      # public patch list names it, so WoW Forever, Midnight and the Classic
      # clients are all set by the upload. Skipped without the WAGO_API_TOKEN secret.
      - name: Upload Classic release to Wago
        id: wago
        if: env.WAGO_UPLOAD_ENABLED == 'true'
        shell: pwsh
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $tocContent = Get-Content -LiteralPath "MidnightSimpleUnitFrames/MidnightSimpleUnitFrames_Mainline.toc" -Raw
          $idMatches = [regex]::Matches($tocContent, "(?m)^##\s+X-Wago-ID:\s*(.+?)\s*$")
          if ($idMatches.Count -ne 1) {
            throw "Expected exactly one X-Wago-ID field in the core Mainline TOC; found $($idMatches.Count)."
          }
          $projectId = $idMatches[0].Groups[1].Value.Trim()

          $zips = @(Get-ChildItem -LiteralPath "dist" -Filter "*.zip" -File)
          if ($zips.Count -ne 1) {
            throw "Expected exactly one validated Classic release zip; found $($zips.Count)."
          }
          $zip = $zips[0]
          $changelogPath = "dist/RELEASE_NOTES_CLASSIC.md"
          if (-not (Test-Path -LiteralPath $changelogPath -PathType Leaf)) {
            throw "Classic release notes are missing: $changelogPath"
          }

          $gameData = Invoke-RestMethod -Method Get -Uri "https://addons.wago.io/api/data/game"
          $flavors = @($gameData.patches.PSObject.Properties)
          $availableNames = @(foreach ($flavor in $flavors) { foreach ($patch in $flavor.Value) { [string]$patch } })
          $gameVersionNames = @(& "./.github/scripts/resolve_release_game_versions.ps1" `
            -ClientMatrixPath "tools/classic-client-matrix.tsv" -AvailableNames $availableNames)

          $metadata = [ordered]@{
            label = $env:CLASSIC_RELEASE_NAME
            stability = $env:CLASSIC_RELEASE_TYPE
            changelog = Get-Content -LiteralPath $changelogPath -Raw
          }
          $assigned = @()
          foreach ($flavor in $flavors) {
            $patches = @($gameVersionNames | Where-Object { @($flavor.Value) -ccontains $_ })
            if ($patches.Count -gt 0) {
              $metadata["supported_$($flavor.Name)_patches"] = [string[]]$patches
              $assigned += "$($flavor.Name)=$($patches -join '/')"
            }
          }
          if ($assigned.Count -eq 0) {
            throw "Wago lists none of [$($gameVersionNames -join ', ')]."
          }
          if ($gameData.stability_values -cnotcontains $metadata.stability) {
            throw "Wago does not accept stability '$($metadata.stability)'."
          }

          $form = @{
            metadata = ($metadata | ConvertTo-Json -Depth 5 -Compress)
            file = Get-Item -LiteralPath $zip.FullName
          }
          try {
            Invoke-RestMethod -Method Post -Uri "https://addons.wago.io/api/projects/$projectId/version" `
              -Headers @{ Authorization = "Bearer $env:WAGO_API_TOKEN"; Accept = "application/json" } `
              -Form $form | Out-Null
          } catch {
            $detail = $_.ErrorDetails.Message
            if ([string]::IsNullOrWhiteSpace($detail)) { $detail = [string]$_ }
            throw "Wago upload failed for '$($env:CLASSIC_RELEASE_NAME)' ($($assigned -join ', ')): $detail"
          }
          "patches=$($assigned -join ', ')" >> $env:GITHUB_OUTPUT
          Write-Host "Wago upload accepted: project $projectId, '$env:CLASSIC_RELEASE_NAME' ($($metadata.stability)), patches [$($assigned -join ', ')]."

      # CurseForge and Wago answer with the file id, the accepted game versions
      # and the assigned patches. They reach the script through env, never
      # through ${{ }} inside the here-string, so a response can only ever be
      # summary text and never PowerShell.
      - name: Write Classic release summary
        shell: pwsh
        env:
          CF_FILE_ID: ${{ steps.curseforge.outputs.file_id }}
          CF_GAME_VERSIONS: ${{ steps.curseforge.outputs.game_versions }}
          WAGO_PATCHES: ${{ steps.wago.outputs.patches }}
        run: |
          $wagoPatches = $env:WAGO_PATCHES
          if ([string]::IsNullOrWhiteSpace($wagoPatches)) { $wagoPatches = "not uploaded" }
          @"
          ## MSUF Classic CurseForge $($env:CLASSIC_RELEASE_TYPE)

          - Tag: ``$env:CLASSIC_RELEASE_TAG``
          - Version: ``$env:CLASSIC_RELEASE_VERSION``
          - Display name: ``$env:CLASSIC_RELEASE_NAME``
          - CurseForge project: ``1384660``
          - CurseForge file: ``$env:CF_FILE_ID``
          - Game versions: ``$env:CF_GAME_VERSIONS``
          - Wago patches: ``$wagoPatches``
          - Release type: ``$env:CLASSIC_RELEASE_TYPE``
          "@ >> $env:GITHUB_STEP_SUMMARY
