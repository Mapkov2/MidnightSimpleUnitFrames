name: MSUF 7.0 gate

# Commit contracts use the pinned release inventory. The independent source-audit
# job follows Blizzard branch tips and reports upstream drift separately.
on:
  push:
    branches:
      - main
    paths:
      - "MidnightSimpleUnitFrames/**"
      - "MidnightSimpleUnitFrames_Options/**"
      - "MidnightSimpleUnitFrames_Locales/**"
      - "tools/**"
      - ".github/**"
      - "VERSION"
      - "CHANGELOG.md"
  pull_request:
    branches:
      - main
    paths:
      - "MidnightSimpleUnitFrames/**"
      - "MidnightSimpleUnitFrames_Options/**"
      - "MidnightSimpleUnitFrames_Locales/**"
      - "tools/**"
      - ".github/**"
      - "VERSION"
      - "CHANGELOG.md"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    uses: ./.github/workflows/release-check.yml

  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The mirror-reading smoke below is plain Lua 5.1; the audit is pwsh and git.
      - name: Install Lua 5.1 for the mirror smoke
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          lua5.1 -v

      # The audit reads Blizzard's branch tips through git only (show, grep,
      # rev-parse), so a depth-1 clone of every branch needs no working tree.
      # The tips are listed so a red audit names the branch that moved.
      - name: Clone the Blizzard UI source mirror
        shell: pwsh
        run: |
          $mirror = "_local_workflows/references/wow-ui-source"
          git clone --depth 1 --no-single-branch --no-checkout --origin upstream https://github.com/Gethe/wow-ui-source.git $mirror
          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone the Blizzard UI source mirror."
          }
          if (-not (Test-Path -LiteralPath "$mirror/.git" -PathType Container)) {
            throw "The Blizzard UI source mirror did not land at $mirror/.git."
          }
          git -C $mirror for-each-ref "--format=%(refname:short) %(objectname:short) %(committerdate:short)" refs/remotes/upstream
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list the Blizzard UI source branches."
          }

      - name: Run the Blizzard UI source audit
        shell: pwsh
        run: |
          & ./tools/audit-classic-ui-source.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Blizzard Classic source contract audit failed."
          }

      # The one smoke that reads the mirror: push-gate runs it without the
      # mirror, where it checks the attribute contracts only. This run must
      # have used the mirror, so a clone that lands in the wrong place cannot
      # leave a green job.
      - name: Run the smoke that reads the Blizzard UI source mirror
        shell: pwsh
        run: |
          $report = @(& lua5.1 tools/tests/group_raid_header_blizzard_smoke.lua $PWD.Path 2>&1 | ForEach-Object { [string]$_ })
          $exitCode = $LASTEXITCODE
          $report | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "Group raid header on Blizzard SecureGroupHeaders smoke failed."
          }
          if (($report -join "`n") -notmatch 'Blizzard branches') {
            throw "The mirror smoke ran without the Blizzard UI source mirror."
          }
