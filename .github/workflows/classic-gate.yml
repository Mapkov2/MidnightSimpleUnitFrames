name: MSUF Classic gate

# Runs the Classic gate for every change to the addon folders, the tooling or
# the workflows on the classic branch, as two jobs: the self-contained subset
# and the full gate. The branch filters keep tag pushes out: path filters are
# not evaluated for tags.
on:
  push:
    branches:
      - classic
    paths:
      - "MidnightSimpleUnitFrames/**"
      - "MidnightSimpleUnitFrames_Options/**"
      - "MidnightSimpleUnitFrames_Assistant/**"
      - "tools/**"
      - ".github/**"
  pull_request:
    branches:
      - classic
    paths:
      - "MidnightSimpleUnitFrames/**"
      - "MidnightSimpleUnitFrames_Options/**"
      - "MidnightSimpleUnitFrames_Assistant/**"
      - "tools/**"
      - ".github/**"

permissions:
  contents: read

jobs:
  classic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The three steps below are the environment and gate steps of the
      # release workflow; keep them in step with that workflow.
      - name: Set up Python for the Classic gate
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1 for the Classic gate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          sudo ln -sf "$(command -v lua5.1)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.1)" /usr/local/bin/luac
          lua -v
          luac -v

      # -SelfContained runs every check that needs neither a Retail checkout
      # nor the Blizzard UI source mirror: syntax, load order, error paths,
      # ownership manifests and the smokes. It reads nothing but this commit,
      # so the classic-full-gate job below covers the rest.
      - name: Run the self-contained Classic gate
        shell: pwsh
        run: |
          & ./tools/test-classic-prototype.ps1 -SelfContained
          if ($LASTEXITCODE -ne 0) {
            throw "Classic self-contained gate failed."
          }

  # The full gate: everything above, plus Retail parity, override bases and
  # owned-shadow drift against a clean checkout of the Retail commit this tree
  # mirrors, plus the Blizzard UI source audit. It stays a separate job on
  # purpose. The audit reads the live branch tips of Gethe/wow-ui-source, so
  # this job can turn red on an unchanged commit when Blizzard ships a change
  # the audit pins; catching that is its purpose. The self-contained job reads
  # nothing but the commit, so its result always belongs to the commit alone.
  # Keep the two signals apart: never fold this job into the one above or make
  # either depend on the other. The steps live in the reusable workflow so the
  # release runs exactly this gate instead of a second copy of it.
  classic-full-gate:
    uses: ./.github/workflows/classic-full-gate.yml
