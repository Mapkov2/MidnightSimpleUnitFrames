name: MSUF Classic gate

# Runs the self-contained Classic gate for every change to the addon folders,
# the tooling or the workflows on the classic branch. The branch filters keep
# tag pushes out: path filters are not evaluated for tags.
on:
  push:
    branches:
      - classic
    paths:
      - "MidnightSimpleUnitFrames/**"
      - "MidnightSimpleUnitFrames_Options/**"
      - "MidnightSimpleUnitFrames_Assistant/**"
      - "tools/**"
      - ".github/**"
  pull_request:
    branches:
      - classic
    paths:
      - "MidnightSimpleUnitFrames/**"
      - "MidnightSimpleUnitFrames_Options/**"
      - "MidnightSimpleUnitFrames_Assistant/**"
      - "tools/**"
      - ".github/**"

permissions:
  contents: read

jobs:
  classic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v5

      # The three steps below are the environment and gate steps of
      # release-classic.yml; keep them in step with that workflow.
      - name: Set up Python for the Classic gate
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1 for the Classic gate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          sudo ln -sf "$(command -v lua5.1)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.1)" /usr/local/bin/luac
          lua -v
          luac -v

      # The full gate also needs a clean Retail checkout and the Blizzard UI
      # source mirror, so it stays a local step. -SelfContained runs every
      # check that needs neither: syntax, load order, error paths, ownership
      # manifests and the Lua smokes.
      - name: Run the self-contained Classic gate
        shell: pwsh
        run: |
          & ./tools/test-classic-prototype.ps1 -SelfContained
          if ($LASTEXITCODE -ne 0) {
            throw "Classic self-contained gate failed."
          }
